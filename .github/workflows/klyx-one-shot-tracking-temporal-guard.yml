name: KLYX one-shot tracking temporal guard

on:
  push:
    branches:
      - security/tracking-temporal-guard

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/tracking-temporal-guard

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply tracking timing guard
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'app/api/bookings/tracking/route.ts';
          let source = fs.readFileSync(path, 'utf8');

          if (source.includes('KLYX_TRACKING_TEMPORAL_GUARD_2026')) {
            console.log('Tracking temporal guard already applied.');
            process.exit(0);
          }

          const replacements = [
            [
              'import { supabaseAdmin } from "@/lib/supabase-admin";\n',
              'import { supabaseAdmin } from "@/lib/supabase-admin";\nimport { getBookingTrackingTimingError } from "@/lib/booking-tracking-time";\n'
            ],
            [
              '  booking_group_id: string | null;\n  status: string;\n',
              '  booking_group_id: string | null;\n  booking_date: string;\n  start_time: string;\n  status: string;\n'
            ],
            [
              '"id, parent_id, provider_id, babysitter_id, booking_group_id, status, payment_status, service_status, provider_finished_at, client_confirmed_at"',
              '"id, parent_id, provider_id, babysitter_id, booking_group_id, booking_date, start_time, status, payment_status, service_status, provider_finished_at, client_confirmed_at"'
            ],
            [
              '    const currentStatus =\n      booking.service_status ?? "scheduled";\n',
              '    // KLYX_TRACKING_TEMPORAL_GUARD_2026\n    const timingError = getBookingTrackingTimingError({\n      bookingDate: booking.booking_date,\n      startTime: booking.start_time,\n      action,\n    });\n\n    if (timingError) {\n      return NextResponse.json(\n        { error: timingError },\n        { status: 409 }\n      );\n    }\n\n    const currentStatus =\n      booking.service_status ?? "scheduled";\n'
            ]
          ];

          for (const [before, after] of replacements) {
            if (!source.includes(before)) {
              throw new Error(`Expected tracking route fragment was not found: ${before.slice(0, 80)}`);
            }
            source = source.replace(before, after);
          }

          fs.writeFileSync(path, source);
          NODE

          git diff --check

      - name: Commit tracking timing guard
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app/api/bookings/tracking/route.ts; then
            echo "No tracking route changes to commit."
            exit 0
          fi

          git config user.name "klyx-ci"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/bookings/tracking/route.ts
          git commit -m "security: block premature booking tracking"
          git push origin HEAD:security/tracking-temporal-guard
