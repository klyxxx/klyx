name: KLYX Dependency Self Fix

on:
  push:
    branches:
      - agent/dr-git-hardening-20260929
    paths:
      - .github/workflows/klyx-dependency-self-fix.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: agent/dr-git-hardening-20260929
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Trace vulnerable dependency parents
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { execFileSync } = require('child_process');
          const fs = require('fs');
          const targets = ['ip-address', 'undici', 'vitest'];
          const result = {};
          for (const target of targets) {
            try {
              const raw = execFileSync('npm', ['explain', target, '--json'], { encoding: 'utf8' });
              const tree = JSON.parse(raw);
              const simplifyNode = (n) => ({
                name: n.name,
                version: n.version,
                location: n.location,
                dependents: (n.dependents || []).map((d) => ({
                  type: d.type,
                  name: d.name,
                  spec: d.spec,
                  from: d.from && { name: d.from.name, version: d.from.version, location: d.from.location }
                }))
              });
              result[target] = tree.map(simplifyNode);
            } catch (error) {
              result[target] = { error: String(error.message || error) };
            }
          }
          fs.mkdirSync('.github/dr', { recursive: true });
          fs.writeFileSync('.github/dr/npm-dependency-trace.json', JSON.stringify(result, null, 2) + '\n');
          NODE

      - name: Commit sanitized dependency trace
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/dr/npm-dependency-trace.json
          git diff --cached --check
          git commit -m 'chore(security): trace npm advisory dependency parents'
          git push origin HEAD:agent/dr-git-hardening-20260929
