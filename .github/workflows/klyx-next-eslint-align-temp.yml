name: KLYX temporary Next ESLint alignment

on:
  push:
    branches:
      - tooling/align-next-eslint-20260909

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use stable npm 11 resolver
        run: |
          npm install --global npm@11.19.1 --ignore-scripts
          npm --version

      - name: Refresh only the Next ESLint direct dependency
        run: npm install --package-lock-only --ignore-scripts --save-dev --save-exact eslint-config-next@16.3.3

      - name: Verify exact alignment
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          assert.equal(pkg.dependencies.next, '^16.3.1');
          assert.equal(pkg.devDependencies['eslint-config-next'], '16.3.3');
          assert.equal(lock.packages[''].dependencies.next, '^16.3.1');
          assert.equal(lock.packages[''].devDependencies['eslint-config-next'], '16.3.3');
          assert.equal(lock.packages['node_modules/next'].version, '16.3.3');
          assert.equal(lock.packages['node_modules/eslint-config-next'].version, '16.3.3');
          assert.equal(lock.packages['node_modules/@next/eslint-plugin-next'].version, '16.3.3');
          console.log('Next / eslint-config-next / @next/eslint-plugin-next aligned at locked 16.3.3');
          NODE

      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile change required."
            exit 0
          fi
          git commit -m "chore(tooling): refresh Next ESLint lock"
          git push origin HEAD
