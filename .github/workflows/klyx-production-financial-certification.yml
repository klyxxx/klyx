name: KLYX Production Financial Certification

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact 40-char current main SHA to certify"
        required: true
        type: string
      production_url:
        description: "Canonical public production origin"
        required: true
        default: "https://klyx.be"
        type: string
      evidence_manifest_base64:
        description: "Base64 sanitized 40-cell Mission 1 evidence manifest"
        required: true
        type: string
      confirm_controlled_live:
        description: "Type CERTIFY_CONTROLLED_LIVE_FINANCE"
        required: true
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: klyx-production-financial-certification
  cancel-in-progress: false

jobs:
  certify:
    name: Certify KLYX production financial truth
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    env:
      KLYX_EXPECTED_SHA: ${{ inputs.expected_sha }}
      KLYX_PRODUCTION_URL: ${{ inputs.production_url }}
      KLYX_PRODUCTION_FINANCIAL_MANIFEST_BASE64: ${{ inputs.evidence_manifest_base64 }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      KLYX_FINANCIAL_RECONCILIATION_SECRET: ${{ secrets.KLYX_FINANCIAL_RECONCILIATION_SECRET }}
      KLYX_LIVE_CERTIFICATION_PROFILE_ID: ${{ secrets.KLYX_LIVE_CERTIFICATION_PROFILE_ID }}
      KLYX_FINANCIAL_CERT_PROOF_PATH: production-financial-certification-proof/summary.json

    steps:
      - name: Publish pending certification status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(jq -n             --arg state "pending"             --arg context "KLYX Production Financial Certification"             --arg description "Validating controlled LIVE financial truth"             --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"             '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body --silent --show-error             --request POST             --header "Accept: application/vnd.github+json"             --header "Authorization: Bearer ${GH_TOKEN}"             --header "X-GitHub-Api-Version: 2022-11-28"             "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"             --data "${payload}" >/dev/null

      - name: Verify explicit controlled-LIVE confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm_controlled_live }}" != "CERTIFY_CONTROLLED_LIVE_FINANCE" ]; then
            echo "::error::Explicit controlled-LIVE confirmation is missing."
            exit 1
          fi

      - name: Verify immutable current main SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! [[ "$KLYX_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid expected SHA."
            exit 1
          fi

          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Production financial certification is main-only."
            exit 1
          fi

          if [ "$GITHUB_SHA" != "$KLYX_EXPECTED_SHA" ]; then
            echo "::error::Certification SHA mismatch."
            exit 1
          fi

          main_sha="$(
            curl --fail-with-body --silent --show-error               --header "Accept: application/vnd.github+json"               --header "Authorization: Bearer ${GH_TOKEN}"               --header "X-GitHub-Api-Version: 2022-11-28"               "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" |
              jq -r '.object.sha'
          )"

          if [ "$main_sha" != "$KLYX_EXPECTED_SHA" ]; then
            echo "::error::main moved: expected $KLYX_EXPECTED_SHA, current $main_sha."
            exit 1
          fi

      - name: Verify DR certification on exact SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$(
            curl --fail-with-body --silent --show-error               --header "Accept: application/vnd.github+json"               --header "Authorization: Bearer ${GH_TOKEN}"               --header "X-GitHub-Api-Version: 2022-11-28"               "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${KLYX_EXPECTED_SHA}/statuses?per_page=100"
          )"

          if ! printf '%s' "$response" | jq -e '
            any(
              .[];
              .context == "KLYX Disaster Recovery Certification"
              and .state == "success"
            )
          ' >/dev/null; then
            echo "::error::Exact SHA is not DR-certified."
            exit 1
          fi

      - name: Checkout exact repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify certification secrets without printing them
        shell: bash
        run: |
          set -euo pipefail
          for variable in             NEXT_PUBLIC_SUPABASE_URL             SUPABASE_SERVICE_ROLE_KEY             SUPABASE_DB_URL             KLYX_FINANCIAL_RECONCILIATION_SECRET             KLYX_LIVE_CERTIFICATION_PROFILE_ID
          do
            if [ -z "${!variable:-}" ]; then
              echo "::error::Missing certification secret: ${variable}"
              exit 1
            fi
          done

          case "$KLYX_PRODUCTION_URL" in
            https://*) ;;
            *) echo "::error::Production URL must use HTTPS."; exit 1 ;;
          esac

      - name: Decode private certification manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest_path="$RUNNER_TEMP/klyx-production-financial-manifest.json"
          printf '%s' "$KLYX_PRODUCTION_FINANCIAL_MANIFEST_BASE64" |
            base64 --decode > "$manifest_path"

          node - "$manifest_path" <<'NODE'
          const fs = require("fs");
          const path = process.argv[2];
          const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
          if (
            manifest?.version !== 1 ||
            !Array.isArray(manifest?.cells) ||
            manifest.cells.length !== 40
          ) {
            process.exit(2);
          }
          NODE

          echo "KLYX_FINANCIAL_CERT_MANIFEST_PATH=$manifest_path" >> "$GITHUB_ENV"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.111.0

      - name: Prove production migrations have no pending write
        shell: bash
        run: |
          set -euo pipefail
          effective_db_url="$(node <<'NODE'
          const raw = process.env.SUPABASE_DB_URL ?? "";
          const password = process.env.SUPABASE_DB_PASSWORD ?? "";
          const url = new URL(raw);
          if (!["postgres:", "postgresql:"].includes(url.protocol)) process.exit(2);
          if (
            !url.hostname.endsWith(".supabase.co") &&
            !url.hostname.endsWith(".pooler.supabase.com")
          ) process.exit(3);
          if (password) url.password = password;
          if (!url.password) process.exit(4);
          process.stdout.write(url.toString());
          NODE
          )"
          echo "::add-mask::$effective_db_url"
          mkdir -p production-financial-certification-proof
          supabase db push             --db-url "$effective_db_url"             --dry-run 2>&1 |
            tee production-financial-certification-proof/supabase-dry-run.txt

          if grep -Fqi "Would push these migrations" production-financial-certification-proof/supabase-dry-run.txt; then
            echo "::error::Production Supabase has pending migrations."
            exit 1
          fi

      - name: Run 40-cell canonical financial certification
        run: node scripts/verify-klyx-production-financial-certification.mjs

      - name: Guard sanitized proof
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const path = "production-financial-certification-proof/summary.json";
          const proof = JSON.parse(fs.readFileSync(path, "utf8"));
          if (
            proof.overall !== "certified" ||
            proof.matrixCells !== 40 ||
            proof.invariants?.exactSha !== true ||
            proof.invariants?.controlledLiveOnly !== true ||
            proof.invariants?.canonicalLedger !== true ||
            proof.invariants?.settlementTruth !== true ||
            proof.invariants?.stripeTruthReconciled !== true ||
            proof.invariants?.silentCorrection !== false
          ) {
            process.exit(2);
          }

          const raw = JSON.stringify(proof);
          for (const forbidden of [
            "sk_live_",
            "whsec_",
            "service_role",
            "bookingIds",
            "stripe_payment_intent_id",
            "stripe_transfer_id",
            "stripe_refund_id",
            "parent_id",
            "provider_account_id"
          ]) {
            if (raw.includes(forbidden)) process.exit(3);
          }
          NODE

      - name: Upload sanitized certification proof
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: klyx-production-financial-certification-${{ github.sha }}
          path: production-financial-certification-proof/summary.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish final certification status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state="failure"
          description="Mission 1 NOT CERTIFIED: production financial gate failed"

          if [ "$JOB_STATUS" = "success" ]; then
            state="success"
            description="40/40 LIVE cells coherent: Ledger = Settlement = Stripe"
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            state="error"
            description="Mission 1 certification cancelled"
          fi

          target_sha="${KLYX_EXPECTED_SHA:-$GITHUB_SHA}"
          if ! [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]; then
            target_sha="$GITHUB_SHA"
          fi

          payload="$(jq -n             --arg state "$state"             --arg context "KLYX Production Financial Certification"             --arg description "$description"             --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"             '{state:$state,context:$context,description:$description,target_url:$target_url}')"

          curl --fail-with-body --silent --show-error             --request POST             --header "Accept: application/vnd.github+json"             --header "Authorization: Bearer ${GH_TOKEN}"             --header "X-GitHub-Api-Version: 2022-11-28"             "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${target_sha}"             --data "${payload}" >/dev/null
