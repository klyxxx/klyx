name: KLYX Lockfile Security Refresh Temp

on:
  push:
    branches:
      - mission/provider-control-plane-foundation

permissions:
  contents: read

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh vulnerable production transitives
        run: npm audit fix --package-lock-only --omit=dev

      - name: Verify production audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Upload corrected lockfile
        uses: actions/upload-artifact@v4
        with:
          name: klyx-corrected-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
