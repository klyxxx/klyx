name: KLYX Operational Sentinel

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Canonical KLYX production origin (optional if repository variable is configured)"
        required: false
        type: string

  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

concurrency:
  group: klyx-operational-sentinel-${{ github.repository }}
  cancel-in-progress: true

jobs:
  public-smoke:
    name: Read-only canonical production smoke
    if: ${{ github.event_name == 'workflow_dispatch' || vars.KLYX_OPERATIONAL_SENTINEL_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      KLYX_PRODUCTION_URL: ${{ inputs.target_url || vars.KLYX_PRODUCTION_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate sentinel configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${KLYX_PRODUCTION_URL:-}" ]; then
            echo "::error::Configure repository variable KLYX_PRODUCTION_URL or provide target_url manually."
            exit 1
          fi

      - name: Run read-only production sentinel
        run: node scripts/operations/check-public-production.mjs

      - name: Write success summary
        if: success()
        shell: bash
        run: |
          {
            echo "## KLYX Operational Sentinel"
            echo
            echo "- Result: PASS"
            echo "- Scope: public liveness + homepage"
            echo "- Method: GET only"
            echo "- Mutations: none"
            echo "- Timestamp (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_STEP_SUMMARY"
