name: KLYX temporary dependency lock refresh

on:
  push:
    branches:
      - refactor/provider-finances-destination-klyx-ux

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[skip lock refresh]') }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/provider-finances-destination-klyx-ux

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Refresh vulnerable production transitive dependencies
        run: npm audit fix --package-lock-only --omit=dev

      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes needed"
            exit 0
          fi
          git config user.name "klyx-security-bot"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(security): refresh audited dependency lock [skip lock refresh]"
          git push origin HEAD:refactor/provider-finances-destination-klyx-ux
