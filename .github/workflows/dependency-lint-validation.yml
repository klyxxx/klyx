name: Temporary dependency lint validation

on:
  push:
    branches:
      - validation/dependency-audit-lint-20260909
    paths:
      - .github/workflows/dependency-lint-validation.yml

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
