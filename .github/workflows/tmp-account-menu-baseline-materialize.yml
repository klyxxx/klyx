name: Temporary account menu baseline materializer
on:
  push:
    branches:
      - ui/account-compact-menu-20260911
    paths:
      - ".github/workflows/tmp-account-menu-baseline-materialize.yml"
permissions:
  contents: write
  actions: read
jobs:
  materialize:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/account-compact-menu-20260911
      - name: Materialize exact account-menu visual baselines and self-clean
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/10280258513/zip > /tmp/ux-artifact.zip
          mkdir -p /tmp/ux-artifact
          unzip -q /tmp/ux-artifact.zip -d /tmp/ux-artifact

          desktop='/tmp/ux-artifact/ux-test-results/ux-visual-certification-KL-082ff-surable-and-visually-stable-desktop-chromium'
          mobile='/tmp/ux-artifact/ux-test-results/ux-visual-certification-KL-082ff-surable-and-visually-stable-mobile-chromium'
          desktop_target='tests/e2e/ux-visual-certification-snapshots/desktop-chromium'
          mobile_target='tests/e2e/ux-visual-certification-snapshots/mobile-chromium'

          cp "$desktop/assistant-desktop-actual.png" "$desktop_target/assistant-desktop.png"
          cp "$desktop/profile-desktop-actual.png" "$desktop_target/profile-desktop.png"
          cp "$desktop/settings-desktop-actual.png" "$desktop_target/settings-desktop.png"
          cp "$desktop/request-photo-desktop-actual.png" "$desktop_target/request-photo-desktop.png"
          cp "$desktop/active-mission-desktop-actual.png" "$desktop_target/active-mission-desktop.png"
          cp "$mobile/assistant-mobile-actual.png" "$mobile_target/assistant-mobile.png"
          cp "$mobile/profile-mobile-actual.png" "$mobile_target/profile-mobile.png"
          cp "$mobile/settings-mobile-actual.png" "$mobile_target/settings-mobile.png"
          cp "$mobile/request-photo-mobile-actual.png" "$mobile_target/request-photo-mobile.png"
          cp "$mobile/active-mission-mobile-actual.png" "$mobile_target/active-mission-mobile.png"

          python - <<'PY'
          from pathlib import Path
          import hashlib

          expected = {
              'tests/e2e/ux-visual-certification-snapshots/desktop-chromium/assistant-desktop.png': (34962, '55c408d700273cfb10416d342daffd8bf8a96ec0'),
              'tests/e2e/ux-visual-certification-snapshots/desktop-chromium/profile-desktop.png': (36713, '50337d94943d1f9a6c49778630432b007c39025a'),
              'tests/e2e/ux-visual-certification-snapshots/desktop-chromium/settings-desktop.png': (44672, 'a982a1647b30e7a46e2d80e26cad1c3ea6413c57'),
              'tests/e2e/ux-visual-certification-snapshots/desktop-chromium/request-photo-desktop.png': (67561, '6448a2160d5c2ee5316c0b9f4184393f65b97982'),
              'tests/e2e/ux-visual-certification-snapshots/desktop-chromium/active-mission-desktop.png': (67080, 'aa363ec038d659beda0e4085c1d426bae8a092c1'),
              'tests/e2e/ux-visual-certification-snapshots/mobile-chromium/assistant-mobile.png': (27116, 'a7660b9e5c8ca0c14b393a375655725b5e9a6842'),
              'tests/e2e/ux-visual-certification-snapshots/mobile-chromium/profile-mobile.png': (24179, '3173034ddfde697efe642708582b90f3066cc7cb'),
              'tests/e2e/ux-visual-certification-snapshots/mobile-chromium/settings-mobile.png': (32321, '608c8405f76e60b8280b75b923fd3c2a8782a5e6'),
              'tests/e2e/ux-visual-certification-snapshots/mobile-chromium/request-photo-mobile.png': (37346, '30b770f12df7f97cfad2b2cd860ad3af0d622b1d'),
              'tests/e2e/ux-visual-certification-snapshots/mobile-chromium/active-mission-mobile.png': (44772, '5cc1fac3bef8b929b62cdd41c8116a0704fa5987'),
          }

          for filename, (size, sha) in expected.items():
              p = Path(filename)
              b = p.read_bytes()
              assert len(b) == size, (filename, len(b), size)
              assert b[:8] == b'\x89PNG\r\n\x1a\n', filename
              git_sha = hashlib.sha1(f'blob {len(b)}\0'.encode() + b).hexdigest()
              assert git_sha == sha, (filename, git_sha, sha)
              print(filename, git_sha)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/ux-visual-certification-snapshots
          git rm .github/workflows/tmp-account-menu-baseline-materialize.yml
          git commit -m 'test(ux): refresh compact account menu visual baselines'
          git push origin HEAD:ui/account-compact-menu-20260911
