name: KLYX E2E

on:
  workflow_dispatch:

  # KLYX_CI_SINGLE_EVENT_PHASE_12A_10
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read
  pull-requests: read

# The authenticated E2E suite uses one dedicated KLYX account and
# changes its active profile. Serialize all runs so two PRs cannot
# race on that shared mutable test state. UX / Visual is a second
# job in this same run and starts only after browser-tests succeeds.
concurrency:
  group: klyx-e2e-${{ github.repository }}
  cancel-in-progress: false

jobs:
  browser-tests:
    name: Playwright browser verification
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      KLYX_E2E_EMAIL: ${{ secrets.KLYX_E2E_EMAIL }}
      KLYX_E2E_SESSION_BOOTSTRAP: "1"
      KLYX_PLAYWRIGHT_SYSTEM_CHROME: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # KLYX_CURRENT_TREE_SECRET_SCAN_PHASE_12A_9
      - name: Scan current repository for secrets
        shell: pwsh
        run: ./scripts/check-klyx-public-repo-secrets.ps1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate required environment
        shell: bash
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "NEXT_PUBLIC_SUPABASE_URL is missing"
            exit 1
          fi

          if [ -z "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY is missing"
            exit 1
          fi

          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY is missing"
            exit 1
          fi

          if [ -z "$KLYX_E2E_EMAIL" ]; then
            echo "KLYX_E2E_EMAIL is missing"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # KLYX_DEPENDENCY_SECURITY_GATE_PHASE_10A
      - name: Production dependency security
        run: npm audit --omit=dev --audit-level=moderate

      - name: Development dependency security
        run: npm audit --audit-level=high

      - name: Verify system Chrome
        shell: bash
        run: |
          google-chrome --version

      - name: Install Playwright FFmpeg
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
        run: npx playwright install ffmpeg

      - name: Unit and integration tests
        run: npm test

      - name: TypeScript
        run: npx tsc --noEmit --pretty false

      # KLYX_PRODUCTION_BUILD_GATE_PHASE_10A
      - name: Production build
        run: npm run build

      - name: Playwright E2E
        run: npm run test:e2e

      # KLYX_PLAYWRIGHT_SECRET_SCAN_PHASE_7D_1
      - name: Guard Playwright report secrets
        id: artifact_guard
        if: always()
        shell: bash
        run: |
          python <<'PY'
          import os
          import shutil
          import sys
          import zipfile
          from pathlib import Path

          service_role_text = os.environ.get(
              "SUPABASE_SERVICE_ROLE_KEY",
              "",
          )

          if not service_role_text:
              print(
                  "E2E service-role credential unavailable for artifact guard."
              )

              shutil.rmtree(
                  "playwright-report",
                  ignore_errors=True,
              )

              shutil.rmtree(
                  "test-results",
                  ignore_errors=True,
              )

              sys.exit(1)

          sensitive_values = [
              service_role_text.encode("utf-8"),
          ]

          roots = [
              Path("playwright-report"),
              Path("test-results"),
          ]

          leak_found = False

          def contains_secret(
              data: bytes
          ) -> bool:
              return any(
                  value and value in data
                  for value in sensitive_values
              )

          def scan_zip(
              path: Path
          ) -> bool:
              try:
                  with zipfile.ZipFile(
                      path
                  ) as archive:
                      for member in archive.infolist():
                          if member.is_dir():
                              continue

                          try:
                              data = archive.read(
                                  member
                              )
                          except Exception:
                              continue

                          if contains_secret(
                              data
                          ):
                              return True

                  return False

              except Exception:
                  return False

          for root in roots:
              if not root.exists():
                  continue

              for path in root.rglob(
                  "*"
              ):
                  if not path.is_file():
                      continue

                  try:
                      data = (
                          path.read_bytes()
                      )
                  except Exception:
                      continue

                  if contains_secret(
                      data
                  ):
                      leak_found = True
                      break

                  if zipfile.is_zipfile(
                      path
                  ):
                      if scan_zip(
                          path
                      ):
                          leak_found = True
                          break

              if leak_found:
                  break

          if leak_found:
              shutil.rmtree(
                  "playwright-report",
                  ignore_errors=True,
              )

              shutil.rmtree(
                  "test-results",
                  ignore_errors=True,
              )

              print(
                  "Sensitive E2E credential detected. "
                  "Artifacts deleted."
              )

              sys.exit(1)

          print(
              "Playwright report secret scan: PASS"
          )
          PY

      - name: Upload Playwright report
        if: ${{ always() && steps.artifact_guard.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: klyx-playwright-report-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      # KLYX_AUTO_MERGE_GUARD_PHASE_12A_11
      - name: Reject armed GitHub auto-merge
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          KLYX_PR_NUMBER: ${{ github.event.pull_request.number }}
          KLYX_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          response="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$KLYX_REPOSITORY/pulls/$KLYX_PR_NUMBER"
          )"

          auto_merge_state="$(printf '%s' "$response" | python -c 'import json, sys; payload = json.load(sys.stdin); print("armed" if payload.get("auto_merge") is not None else "disabled")')"

          if [ "$auto_merge_state" != "disabled" ]; then
            echo "GitHub auto-merge is armed for PR #$KLYX_PR_NUMBER."
            echo "KLYX policy requires an explicit manual merge command."
            exit 1
          fi

          echo "GitHub auto-merge guard: PASS"

  ux-visual-certification:
    name: KLYX UX / Visual Certification
    needs: browser-tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      KLYX_E2E_EMAIL: ${{ secrets.KLYX_E2E_EMAIL }}
      KLYX_E2E_SESSION_BOOTSTRAP: "1"
      KLYX_PLAYWRIGHT_SYSTEM_CHROME: "1"
      KLYX_VISUAL_BASELINE_AVAILABLE: "0"
      KLYX_VISUAL_UPDATE_BASELINE: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan current repository for secrets
        shell: pwsh
        run: ./scripts/check-klyx-public-repo-secrets.ps1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate required environment
        shell: bash
        run: |
          set -euo pipefail
          for variable in \
            NEXT_PUBLIC_SUPABASE_URL \
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            SUPABASE_SERVICE_ROLE_KEY \
            KLYX_E2E_EMAIL
          do
            if [ -z "${!variable:-}" ]; then
              echo "$variable is missing"
              exit 1
            fi
          done

      - name: Install locked dependencies
        run: npm ci

      - name: Verify system Chrome
        run: google-chrome --version

      - name: Install Playwright FFmpeg
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
        run: npx playwright install ffmpeg

      - name: Load latest certified main visual baseline
        if: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/ux-visual/__screenshots__

          baseline_run_id="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/klyx-e2e.yml/runs?branch=main&status=success&per_page=10" \
              --jq '.workflow_runs[].id' \
              2>/dev/null \
              | while read -r run_id; do
                  if gh api \
                    "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
                    --jq '.artifacts[] | select(.name == "klyx-ux-visual-baseline") | .id' \
                    2>/dev/null \
                    | grep -q .
                  then
                    echo "$run_id"
                    break
                  fi
                done
          )"

          if [ -z "$baseline_run_id" ]; then
            echo "No certified main visual baseline exists yet."
            echo "KLYX_VISUAL_BASELINE_AVAILABLE=0" >> "$GITHUB_ENV"
            exit 0
          fi

          if gh run download "$baseline_run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name klyx-ux-visual-baseline \
            --dir tests/ux-visual/__screenshots__
          then
            echo "Loaded visual baseline from main E2E run $baseline_run_id."
            echo "KLYX_VISUAL_BASELINE_AVAILABLE=1" >> "$GITHUB_ENV"
          else
            echo "Certified main E2E run has no downloadable visual baseline."
            echo "KLYX_VISUAL_BASELINE_AVAILABLE=0" >> "$GITHUB_ENV"
          fi

      - name: Select main baseline update mode
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          echo "KLYX_VISUAL_UPDATE_BASELINE=1" >> "$GITHUB_ENV"
          echo "KLYX_VISUAL_BASELINE_AVAILABLE=1" >> "$GITHUB_ENV"

      - name: TypeScript
        run: npx tsc --noEmit --pretty false

      - name: Production build
        run: npm run build

      - name: Run objective UX and visual certification
        id: ux_visual
        shell: bash
        run: |
          set -euo pipefail
          if [ "$KLYX_VISUAL_UPDATE_BASELINE" = "1" ]; then
            npx playwright test \
              --config=playwright.ux-visual.config.ts \
              --update-snapshots
          else
            npx playwright test \
              --config=playwright.ux-visual.config.ts
          fi

      - name: Guard UX / Visual artifacts against secrets
        id: ux_artifact_guard
        if: always()
        shell: bash
        run: |
          python <<'PY'
          import os
          import shutil
          import sys
          import zipfile
          from pathlib import Path

          service_role = os.environ.get("SUPABASE_SERVICE_ROLE_KEY", "").encode("utf-8")
          if not service_role:
              print("Service-role credential unavailable for UX artifact guard.")
              sys.exit(1)

          roots = [
              Path("ux-visual-report"),
              Path("ux-visual-results"),
              Path("tests/ux-visual/__screenshots__"),
          ]

          def contains_secret(data: bytes) -> bool:
              return service_role in data

          leak = False
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob("*"):
                  if not path.is_file():
                      continue
                  try:
                      data = path.read_bytes()
                  except Exception:
                      continue
                  if contains_secret(data):
                      leak = True
                      break
                  if zipfile.is_zipfile(path):
                      try:
                          with zipfile.ZipFile(path) as archive:
                              if any(
                                  contains_secret(archive.read(member))
                                  for member in archive.infolist()
                                  if not member.is_dir()
                              ):
                                  leak = True
                                  break
                      except Exception:
                          pass
              if leak:
                  break

          if leak:
              for root in roots:
                  shutil.rmtree(root, ignore_errors=True)
              print("Sensitive credential detected. UX / Visual artifacts deleted.")
              sys.exit(1)

          print("UX / Visual artifact secret scan: PASS")
          PY

      - name: Publish UX / Visual diagnostic report
        if: ${{ always() && steps.ux_artifact_guard.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: klyx-ux-visual-report-${{ github.run_id }}
          path: |
            ux-visual-report/
            ux-visual-results/
            tests/ux-visual/__screenshots__/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish certified main visual baseline
        if: ${{ success() && env.KLYX_VISUAL_UPDATE_BASELINE == '1' && steps.ux_artifact_guard.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: klyx-ux-visual-baseline
          path: tests/ux-visual/__screenshots__/
          if-no-files-found: error
          retention-days: 30

      - name: Write certification summary
        if: always()
        shell: bash
        run: |
          {
            echo "### KLYX UX / Visual Certification"
            echo ""
            echo "- Playwright outcome: **${{ steps.ux_visual.outcome }}**"
            echo "- Desktop: 1440×900"
            echo "- Mobile: 390×844"
            echo "- Reference baseline available: **$KLYX_VISUAL_BASELINE_AVAILABLE**"
            echo "- Baseline update mode: **$KLYX_VISUAL_UPDATE_BASELINE**"
            echo "- Diagnostic artifact: \`klyx-ux-visual-report-${{ github.run_id }}\`"
            echo ""
            echo "Measured invariants: overflow, viewport clipping, mission rail geometry, content accessibility, interactive overlap/hit-testing, desktop/mobile shell behavior, Account entry uniqueness, certified language selector, Voice smoke, Photo live smoke, console/page errors, and visual snapshot drift."
          } >> "$GITHUB_STEP_SUMMARY"
