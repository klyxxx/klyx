name: Temporary account menu rail refactor

on:
  push:
    branches:
      - ui/account-compact-menu-20260911

permissions:
  contents: write

jobs:
  patch-rail:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/account-compact-menu-20260911
          fetch-depth: 0

      - name: Remove duplicated account block from MissionRail
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/ui/MissionRail.tsx")
          source = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str = "") -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, got {count}: {old[:80]!r}")
              source = source.replace(old, new, 1)

          replace_once('import { usePathname, useRouter } from "next/navigation";', 'import { usePathname } from "next/navigation";')
          for line in [
              '  BriefcaseBusiness,\n',
              '  CircleUserRound,\n',
              '  LogOut,\n',
              '  Settings,\n',
              '  WalletCards,\n',
              '  Wrench,\n',
          ]:
              replace_once(line)
          replace_once('import AccountSwitcher from "@/app/components/AccountSwitcher";\n')
          replace_once('  const router = useRouter();\n')
          replace_once('  const [accountOpen, setAccountOpen] = useState(false);\n')
          replace_once('  const [loggingOut, setLoggingOut] = useState(false);\n')
          replace_once('''  function openAccountFromCompactRail() {
            setCollapsedPreference(false);
            setAccountOpen(true);
          }

          ''')
          replace_once('''  async function logout() {
            if (loggingOut) return;
            setLoggingOut(true);
            try {
              const supabase = createClient();
              const { error } = await supabase.auth.signOut({ scope: "local" });
              if (error) throw error;
              router.replace("/login");
              router.refresh();
            } catch {
              setLoggingOut(false);
            }
          }

          ''')

          footer_marker = '''\n      <div
        className={
          compact
            ? "border-t border-border px-4 py-4 dark:border-white/8"
            : "border-t border-border px-3 py-4 dark:border-white/8"
        }
      >'''
          start = source.find(footer_marker)
          if start < 0:
              raise SystemExit("Account footer marker not found")
          end = source.find("\n    </aside>\n", start)
          if end < 0:
              raise SystemExit("MissionRail closing marker not found")
          source = source[:start] + source[end:]

          for forbidden in [
              'data-testid="account-entry"',
              'data-testid="account-profile-switcher"',
              '<AccountSwitcher',
              'useRouter()',
          ]:
              if forbidden in source:
                  raise SystemExit(f"Duplicated account UI remains in MissionRail: {forbidden}")

          path.write_text(source, encoding="utf-8")
          PY

      - name: Commit focused refactor and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-account-menu-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ui/MissionRail.tsx .github/workflows/tmp-account-menu-refactor.yml
          git commit -m "ui(account): remove duplicate account controls from mission rail"
          git push origin HEAD:ui/account-compact-menu-20260911
