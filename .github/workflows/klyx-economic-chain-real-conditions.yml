name: KLYX Economic Chain Real Conditions

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Immutable commit SHA to certify"
        required: false
        default: ""
        type: string
      confirm_stripe_test_network:
        description: "Confirm real Stripe TEST network proof"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/klyx-economic-chain-real-conditions.yml"
      - "lib/economic-settlement-eligibility-server.ts"
      - "lib/booking-settlement-server.ts"
      - "lib/economic-identity-server.ts"
      - "scripts/golden-path-economic-chain-stripe-blocked.mjs"
      - "tests/integration/economic-chain-real-conditions.test.ts"
      - "tests/integration/economic-settlement-eligibility-contract.test.ts"
      - "supabase/migrations/20260920093000_klyx_economic_identity_foundation.sql"
      - "supabase/migrations/20260920110000_klyx_economic_settlement_eligibility.sql"

permissions:
  contents: read

concurrency:
  group: klyx-economic-chain-real-conditions-${{ github.repository }}
  cancel-in-progress: false

jobs:
  eligibility-matrix:
    name: Ephemeral economic eligibility matrix
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    env:
      KLYX_GOLDEN_PATH_MUTATIONS_ENABLED: "true"
      KLYX_GOLDEN_PATH_LOCAL_SUPABASE: "true"
      KLYX_PRODUCTION_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_TELEMETRY_DISABLED: "1"

      KLYX_STRIPE_MODE: "test"
      STRIPE_SECRET_KEY: "sk_test_klyx_economic_chain_local_only"
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_klyx_economic_chain_local_only"
      KLYX_LIVE_PAYMENTS_ENABLED: "false"
      NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3100"
      KLYX_ECONOMIC_CHAIN_REAL_CONDITIONS: "true"

    steps:
      - name: Verify immutable certification SHA
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha != '' }}
        shell: bash
        env:
          KLYX_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$KLYX_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid expected certification SHA."
            exit 1
          fi
          if [ "$GITHUB_SHA" != "$KLYX_EXPECTED_SHA" ]; then
            echo "::error::Certification SHA mismatch: expected $KLYX_EXPECTED_SHA, got $GITHUB_SHA."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.111.0

      - name: Use Docker Hub for Supabase CI images
        shell: bash
        run: echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io" >> "$GITHUB_ENV"

      - name: Initialize local Supabase config
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      - name: Start ephemeral local Supabase
        shell: bash
        run: |
          set -euo pipefail
          supabase start \
            -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Export ephemeral credentials
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          local_public_key="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"

          for name in API_URL SERVICE_ROLE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Supabase local status did not provide ${name}."
              exit 1
            fi
          done

          if [ -z "$local_public_key" ]; then
            echo "::error::Supabase local status did not provide ANON_KEY/PUBLISHABLE_KEY."
            exit 1
          fi

          case "$API_URL" in
            http://127.0.0.1:54321|http://localhost:54321) ;;
            *) echo "::error::Refusing non-loopback Supabase API URL: $API_URL"; exit 1 ;;
          esac

          test_email="economic-chain-${GITHUB_RUN_ID}@example.test"
          test_password="$(openssl rand -base64 36 | tr -d '\n')"
          webhook_secret="whsec_$(openssl rand -hex 32)"

          echo "::add-mask::$local_public_key"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "::add-mask::$test_password"
          echo "::add-mask::$webhook_secret"

          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$local_public_key"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "KLYX_E2E_EMAIL=$test_email"
            echo "KLYX_E2E_PASSWORD=$test_password"
            echo "STRIPE_WEBHOOK_SECRET=$webhook_secret"
          } >> "$GITHUB_ENV"

      - name: Verify isolated runtime
        run: >-
          node --input-type=module -e
          "import('./scripts/golden-path-runtime.mjs').then(({assertGoldenPathIsolation}) => assertGoldenPathIsolation())"

      - name: Bootstrap certification account
        run: node scripts/golden-path-bootstrap.mjs

      - name: Verify certification account
        run: node scripts/golden-path-preflight.mjs

      - name: Prepare provider fixture
        run: node scripts/golden-path-provider-fixture.mjs

      - name: Full test suite including real-conditions matrix
        run: npm test

      - name: TypeScript
        run: npx tsc --noEmit --pretty false

      - name: Production build
        run: npm run build

      - name: Destroy ephemeral local Supabase
        if: always()
        shell: bash
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup || true
          fi

  stripe-ok-klyx-blocked:
    name: Stripe TEST OK / KLYX blocked / zero beneficiary Transfer
    needs:
      - eligibility-matrix
    if: ${{ github.event_name == 'pull_request' || inputs.confirm_stripe_test_network == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    env:
      KLYX_GOLDEN_PATH_MUTATIONS_ENABLED: "true"
      KLYX_GOLDEN_PATH_LOCAL_SUPABASE: "true"
      KLYX_PRODUCTION_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_TELEMETRY_DISABLED: "1"

      KLYX_STRIPE_MODE: "test"
      KLYX_STRIPE_SETTLEMENT_MODE: "platform_held"
      KLYX_SETTLEMENT_CONTROL_TEST_READY: "true"
      STRIPE_SECRET_KEY: ${{ secrets.KLYX_STRIPE_TEST_SECRET_KEY }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.KLYX_STRIPE_TEST_PUBLISHABLE_KEY }}
      KLYX_ALLOW_PLATFORM_ONLY_TEST_PAYMENTS: "false"
      KLYX_LIVE_PAYMENTS_ENABLED: "false"
      NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3100"

    steps:
      - name: Verify immutable certification SHA
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha != '' }}
        shell: bash
        env:
          KLYX_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$KLYX_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid expected certification SHA."
            exit 1
          fi
          if [ "$GITHUB_SHA" != "$KLYX_EXPECTED_SHA" ]; then
            echo "::error::Certification SHA mismatch: expected $KLYX_EXPECTED_SHA, got $GITHUB_SHA."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refuse unsafe Stripe runtime
        shell: bash
        run: |
          set -euo pipefail

          case "${STRIPE_SECRET_KEY:-}" in
            sk_test_*) ;;
            *) echo "::error::Real economic-chain proof requires sk_test_*."; exit 1 ;;
          esac

          case "${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}" in
            pk_test_*) ;;
            *) echo "::error::Real economic-chain proof requires pk_test_*."; exit 1 ;;
          esac

          if [ "$KLYX_STRIPE_MODE" != "test" ] || \
             [ "$KLYX_STRIPE_SETTLEMENT_MODE" != "platform_held" ] || \
             [ "$KLYX_SETTLEMENT_CONTROL_TEST_READY" != "true" ] || \
             [ "$KLYX_LIVE_PAYMENTS_ENABLED" != "false" ]; then
            echo "::error::Economic-chain network proof is not TEST-only."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.111.0

      - name: Use Docker Hub for Supabase CI images
        shell: bash
        run: echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io" >> "$GITHUB_ENV"

      - name: Initialize local Supabase config
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      - name: Start ephemeral local Supabase
        shell: bash
        run: |
          set -euo pipefail
          supabase start \
            -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Export ephemeral credentials
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          local_public_key="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"

          for name in API_URL SERVICE_ROLE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Supabase local status did not provide ${name}."
              exit 1
            fi
          done

          if [ -z "$local_public_key" ]; then
            echo "::error::Supabase local status did not provide ANON_KEY/PUBLISHABLE_KEY."
            exit 1
          fi

          case "$API_URL" in
            http://127.0.0.1:54321|http://localhost:54321) ;;
            *) echo "::error::Refusing non-loopback Supabase API URL: $API_URL"; exit 1 ;;
          esac

          test_email="economic-chain-stripe-${GITHUB_RUN_ID}@example.test"
          test_password="$(openssl rand -base64 36 | tr -d '\n')"
          webhook_secret="whsec_$(openssl rand -hex 32)"

          echo "::add-mask::$local_public_key"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "::add-mask::$test_password"
          echo "::add-mask::$webhook_secret"

          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$local_public_key"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "KLYX_E2E_EMAIL=$test_email"
            echo "KLYX_E2E_PASSWORD=$test_password"
            echo "STRIPE_WEBHOOK_SECRET=$webhook_secret"
          } >> "$GITHUB_ENV"

      - name: Verify isolated runtime
        run: >-
          node --input-type=module -e
          "import('./scripts/golden-path-runtime.mjs').then(({assertGoldenPathIsolation}) => assertGoldenPathIsolation())"

      - name: Bootstrap Stripe certification account
        run: node scripts/golden-path-bootstrap.mjs

      - name: Verify Stripe certification account
        run: node scripts/golden-path-preflight.mjs

      - name: Prepare real Stripe TEST recipient fixture
        run: node scripts/golden-path-provider-fixture.mjs

      - name: Production build on certified SHA
        run: npm run build

      - name: Start isolated KLYX server
        shell: bash
        run: |
          set -euo pipefail

          npm run start -- -p 3100 > economic-chain-server.log 2>&1 &
          server_pid=$!
          echo "KLYX_ECONOMIC_CHAIN_SERVER_PID=$server_pid" >> "$GITHUB_ENV"

          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:3100/login > /dev/null; then
              echo "Isolated KLYX server is ready."
              exit 0
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "::error::Isolated KLYX server exited early."
              cat economic-chain-server.log
              exit 1
            fi

            sleep 1
          done

          echo "::error::Isolated KLYX server did not become ready."
          cat economic-chain-server.log
          exit 1

      - name: Prove Stripe OK but KLYX blocked prevents beneficiary Transfer
        run: node scripts/golden-path-economic-chain-stripe-blocked.mjs

      - name: Upload economic-chain Stripe proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: klyx-economic-chain-stripe-proof-${{ github.run_id }}
          path: stripe-network-proof/economic-chain-stripe-ok-klyx-blocked-proof.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: klyx-economic-chain-server-log-${{ github.run_id }}
          path: economic-chain-server.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop isolated KLYX server
        if: always()
        shell: bash
        run: |
          if [ -n "${KLYX_ECONOMIC_CHAIN_SERVER_PID:-}" ] && \
             kill -0 "$KLYX_ECONOMIC_CHAIN_SERVER_PID" 2>/dev/null; then
            kill "$KLYX_ECONOMIC_CHAIN_SERVER_PID" || true
          fi

      - name: Destroy ephemeral local Supabase
        if: always()
        shell: bash
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup || true
          fi
