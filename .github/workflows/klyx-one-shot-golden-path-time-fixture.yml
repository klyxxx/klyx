name: KLYX one-shot golden path time fixture

on:
  push:
    branches:
      - test/golden-path-webhook-mission-review

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/golden-path-webhook-mission-review

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Add temporal guard probe and local time fixture
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/golden-path-service-lifecycle.mjs';
          let source = fs.readFileSync(path, 'utf8');

          if (source.includes('KLYX_GOLDEN_PATH_TEMPORAL_GUARD_PROBE')) {
            console.log('Golden-path temporal guard probe already applied.');
            process.exit(0);
          }

          const functionAnchor = `function stripeSignature(payload, webhookSecret, timestamp) {\n  const digest = createHmac("sha256", webhookSecret)\n    .update(\`\${timestamp}.\${payload}\`, "utf8")\n    .digest("hex");\n\n  return \`t=\${timestamp},v1=\${digest}\`;\n}\n`;

          const functionReplacement = `${functionAnchor}\nfunction brusselsDateOffset(days) {\n  const parts = new Intl.DateTimeFormat("en-CA", {\n    timeZone: "Europe/Brussels",\n    year: "numeric",\n    month: "2-digit",\n    day: "2-digit",\n  }).formatToParts(new Date());\n\n  const values = Object.fromEntries(\n    parts\n      .filter((part) => part.type !== "literal")\n      .map((part) => [part.type, part.value])\n  );\n\n  const anchor = new Date(\n    Date.UTC(\n      Number(values.year),\n      Number(values.month) - 1,\n      Number(values.day) + days,\n      12,\n      0,\n      0\n    )\n  );\n\n  return anchor.toISOString().slice(0, 10);\n}\n`;

          if (!source.includes(functionAnchor)) {
            throw new Error('stripeSignature anchor not found');
          }
          source = source.replace(functionAnchor, functionReplacement);

          const trackingAnchor = `  for (const action of ["en_route", "arrived", "in_progress"]) {\n`;
          const trackingReplacement = `  // KLYX_GOLDEN_PATH_TEMPORAL_GUARD_PROBE\n  const prematureTracking = await requestJson({\n    appOrigin,\n    accessToken,\n    profileId: provider.id,\n    path: "/api/bookings/tracking",\n    method: "POST",\n    expectedStatuses: [409],\n    body: {\n      bookingId: booking.id,\n      action: "en_route",\n      note: "Golden path premature tracking probe.",\n    },\n  });\n\n  if (\n    typeof prematureTracking.payload?.error !== "string" ||\n    !prematureTracking.payload.error.includes("jour prévu")\n  ) {\n    throw new Error(\n      "Future booking tracking was not blocked by the temporal guard."\n    );\n  }\n\n  const historicalDate = brusselsDateOffset(-1);\n  const { error: timeFixtureError } = await admin\n    .from("bookings")\n    .update({\n      booking_date: historicalDate,\n      start_time: "10:00",\n      end_time: "12:00",\n      updated_at: new Date().toISOString(),\n    })\n    .eq("id", booking.id)\n    .eq("payment_status", "paid");\n\n  if (timeFixtureError) {\n    throw new Error(\n      \`Unable to move the ephemeral booking into the service window: \${timeFixtureError.message}\`\n    );\n  }\n\n  for (const action of ["en_route", "arrived", "in_progress"]) {\n`;

          if (!source.includes(trackingAnchor)) {
            throw new Error('tracking loop anchor not found');
          }
          source = source.replace(trackingAnchor, trackingReplacement);

          fs.writeFileSync(path, source);
          NODE

          node --check scripts/golden-path-service-lifecycle.mjs
          git diff --check

      - name: Commit temporal golden-path probe
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/golden-path-service-lifecycle.mjs; then
            echo "No golden-path lifecycle changes to commit."
            exit 0
          fi

          git config user.name "klyx-ci"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/golden-path-service-lifecycle.mjs
          git commit -m "test: prove tracking temporal guard in golden path"
          git push origin HEAD:test/golden-path-webhook-mission-review
