name: Temporary UX baseline materializer
on:
  push:
    branches:
      - test/ux-visual-certification-20260910
    paths:
      - ".github/workflows/tmp-ux-baseline-materialize.yml"
permissions:
  contents: write
  actions: read
jobs:
  materialize:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/ux-visual-certification-20260910
      - name: Materialize exact PNG baseline from certified artifact and self-clean
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/10268026556/zip > /tmp/ux-artifact.zip
          mkdir -p /tmp/ux-artifact
          unzip -q /tmp/ux-artifact.zip -d /tmp/ux-artifact
          src='/tmp/ux-artifact/ux-test-results/ux-visual-certification-KL-082ff-surable-and-visually-stable-mobile-chromium/active-mission-mobile-actual.png'
          target='tests/e2e/ux-visual-certification-snapshots/mobile-chromium/active-mission-mobile.png'
          cp "$src" "$target"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('tests/e2e/ux-visual-certification-snapshots/mobile-chromium/active-mission-mobile.png')
          b = p.read_bytes()
          assert len(b) == 44546, len(b)
          assert b[:8] == b'\x89PNG\r\n\x1a\n'
          git_sha = hashlib.sha1(f'blob {len(b)}\0'.encode() + b).hexdigest()
          assert git_sha == 'af6da8b2cdfa76c4591e8aeebaf1acfc771e2b1c', git_sha
          print('Verified PNG Git blob:', git_sha)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git rm .github/workflows/tmp-ux-baseline-materialize.yml
          git commit -m 'test(ux): materialize valid mobile visual baseline'
          git push origin HEAD:test/ux-visual-certification-20260910
