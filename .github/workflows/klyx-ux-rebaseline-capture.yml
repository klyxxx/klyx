name: KLYX UX Rebaseline Capture

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  capture:
    if: ${{ github.head_ref == 'ci/ux-visual-rebaseline-20260912' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      KLYX_E2E_EMAIL: ${{ secrets.KLYX_E2E_EMAIL }}
      KLYX_E2E_SESSION_BOOTSTRAP: "1"
      KLYX_BRANCH: ${{ github.head_ref }}

    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate required environment
        shell: bash
        run: |
          for variable in \
            NEXT_PUBLIC_SUPABASE_URL \
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            SUPABASE_SERVICE_ROLE_KEY \
            KLYX_E2E_EMAIL
          do
            if [ -z "${!variable}" ]; then
              echo "$variable is missing"
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Playwright Chromium
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build

      - name: Regenerate references with official certification
        run: npx playwright test --config=playwright.ux-certification.config.ts --update-snapshots=all

      - name: Keep only references that were stale or corrupt
        shell: bash
        run: |
          git restore -- \
            tests/e2e/ux-visual-certification-snapshots/mobile-chromium/profile-mobile.png \
            tests/e2e/ux-visual-certification-snapshots/mobile-chromium/request-photo-mobile.png \
            tests/e2e/ux-visual-certification-snapshots/mobile-chromium/active-mission-mobile.png

          python <<'PY'
          from pathlib import Path
          from PIL import Image

          paths = [
              Path("tests/e2e/ux-visual-certification-snapshots/desktop-chromium/assistant-desktop.png"),
              Path("tests/e2e/ux-visual-certification-snapshots/desktop-chromium/profile-desktop.png"),
              Path("tests/e2e/ux-visual-certification-snapshots/desktop-chromium/settings-desktop.png"),
              Path("tests/e2e/ux-visual-certification-snapshots/desktop-chromium/request-photo-desktop.png"),
              Path("tests/e2e/ux-visual-certification-snapshots/desktop-chromium/active-mission-desktop.png"),
              Path("tests/e2e/ux-visual-certification-snapshots/mobile-chromium/assistant-mobile.png"),
              Path("tests/e2e/ux-visual-certification-snapshots/mobile-chromium/settings-mobile.png"),
          ]

          for path in paths:
              with Image.open(path) as image:
                  image.verify()
              print(f"valid PNG: {path}")
          PY

      - name: Guard regenerated references against service-role leakage
        shell: bash
        run: |
          python <<'PY'
          import os
          import sys
          from pathlib import Path

          secret = os.environ.get("SUPABASE_SERVICE_ROLE_KEY", "").encode("utf-8")
          roots = [
              Path("tests/e2e/ux-visual-certification-snapshots/desktop-chromium"),
              Path("tests/e2e/ux-visual-certification-snapshots/mobile-chromium"),
          ]
          if not secret:
              sys.exit(1)
          for root in roots:
              for path in root.rglob("*.png"):
                  if secret in path.read_bytes():
                      print(f"Sensitive credential detected in {path}")
                      sys.exit(1)
          print("UX baseline secret scan: PASS")
          PY

      - name: Commit clean baseline-only result
        shell: bash
        run: |
          git rm -f \
            .github/workflows/klyx-ux-rebaseline-capture.yml \
            playwright.ux-rebaseline.config.ts \
            tests/e2e/ux-rebaseline-capture.spec.ts \
            README.tmp \
            README.tmp2 \
            README.tmp3 \
            README.tmp4

          git add \
            tests/e2e/ux-visual-certification-snapshots/desktop-chromium/assistant-desktop.png \
            tests/e2e/ux-visual-certification-snapshots/desktop-chromium/profile-desktop.png \
            tests/e2e/ux-visual-certification-snapshots/desktop-chromium/settings-desktop.png \
            tests/e2e/ux-visual-certification-snapshots/desktop-chromium/request-photo-desktop.png \
            tests/e2e/ux-visual-certification-snapshots/desktop-chromium/active-mission-desktop.png \
            tests/e2e/ux-visual-certification-snapshots/mobile-chromium/assistant-mobile.png \
            tests/e2e/ux-visual-certification-snapshots/mobile-chromium/settings-mobile.png

          git config user.name "klyxxx"
          git config user.email "yeswork2711@gmail.com"
          git commit -m "test: refresh certified UX visual baselines"
          git push origin "HEAD:${KLYX_BRANCH}"
