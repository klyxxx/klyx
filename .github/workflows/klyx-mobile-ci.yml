name: KLYX Mobile CI

on:
  pull_request:
    paths:
      - "mobile/**"
      - "lib/api-auth.ts"
      - "lib/mobile-push-server.ts"
      - "app/api/mobile/**"
      - "app/api/ops/mobile-push-tick/**"
      - "app/api/provider/sumsub/**"
      - "app/api/assistant/unified/**"
      - "app/api/stripe/create-checkout-session/**"
      - "messages/tolgee/**"
      - "supabase/migrations/*mobile_native_push*.sql"
      - "tests/integration/mobile-client-boundary-contract.test.ts"
      - "tests/integration/mobile-native-push-contract.test.ts"
      - ".github/workflows/klyx-mobile-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: klyx-mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_PUBLIC_KLYX_API_BASE_URL: https://example.invalid
  EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only

jobs:
  mobile-client:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Validate dependency health
        working-directory: mobile
        run: npm run doctor

      - name: Typecheck mobile
        working-directory: mobile
        run: npm run typecheck

      - name: Validate Expo public config
        working-directory: mobile
        run: npx expo config --type public

      - name: Export mobile JavaScript bundle
        working-directory: mobile
        run: npm run export

      - name: Validate Android native generation
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --clean

  mobile-ios:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Validate iOS native generation
        working-directory: mobile
        run: npx expo prebuild --platform ios --no-install --clean

  mobile-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install KLYX dependencies
        run: npm ci

      - name: Certify mobile authority and native push boundary
        run: >-
          npx vitest run
          tests/integration/mobile-client-boundary-contract.test.ts
          tests/integration/mobile-native-push-contract.test.ts
