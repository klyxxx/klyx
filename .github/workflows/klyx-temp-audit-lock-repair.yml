name: KLYX Temporary Dependency Lock Repair

on:
  push:
    branches:
      - dr/exact-main-20261002
    paths:
      - .github/workflows/klyx-temp-audit-lock-repair.yml

permissions:
  contents: write

jobs:
  repair:
    name: Repair production dependency lock and self-remove
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: dr/exact-main-20261002
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Repair production audit lock only
        run: npm audit fix --package-lock-only --omit=dev

      - name: Verify production dependency security
        run: npm audit --omit=dev --audit-level=moderate

      - name: Assert Hono patched and package manifest unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json
          node <<'NODE'
          const lock = require('./package-lock.json');
          const version = lock.packages?.['node_modules/hono']?.version ?? '';
          const parts = version.split('.').map(Number);
          const ok = parts.length === 3 && (parts[0] > 4 || (parts[0] === 4 && (parts[1] > 13 || (parts[1] === 13 && parts[2] >= 7))));
          if (!ok) throw new Error(`Hono remains unpatched: ${version}`);
          console.log(`Hono patched: ${version}`);
          NODE

      - name: Commit repaired lock and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/klyx-temp-audit-lock-repair.yml
          git add package-lock.json
          git commit -m "security(deps): refresh production audit lock"
          git push origin HEAD:dr/exact-main-20261002
