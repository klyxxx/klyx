name: KLYX Temporary Dependency Audit Fix

on:
  push:
    branches:
      - fix/dr-pooler-retry-20260930
    paths:
      - .github/workflows/tmp-klyx-audit-fix.yml

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/dr-pooler-retry-20260930
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use current npm 11 remediation client
        run: |
          npm install --global npm@11
          npm --version

      - name: Apply audit-safe lockfile remediation
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Verify no high or critical vulnerabilities remain
        run: npm audit --audit-level=high

      - name: Verify clean locked install
        run: npm ci --ignore-scripts

      - name: Commit remediated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          if git diff --cached --quiet; then
            echo "No dependency lockfile changes required."
            exit 0
          fi
          git commit -m "security: remediate npm audit vulnerabilities"
          git push origin HEAD:fix/dr-pooler-retry-20260930
