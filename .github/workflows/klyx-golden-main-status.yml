name: KLYX Golden Main Status

on:
  workflow_run:
    workflows:
      - KLYX Golden Path
    types:
      - requested
      - completed

permissions:
  contents: read
  statuses: write

concurrency:
  group: klyx-golden-main-status-${{ github.event.workflow_run.head_sha }}-${{ github.event.action }}
  cancel-in-progress: false

jobs:
  publish-main-status:
    name: Publish Golden main proof status
    if: >-
      ${{
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Checkout status publisher from protected main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve Golden workflow state
        id: state
        env:
          WORKFLOW_ACTION: ${{ github.event.action }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$WORKFLOW_ACTION" = "requested" ]; then
            echo "value=requested" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          conclusion="${WORKFLOW_CONCLUSION:-unknown}"
          echo "value=completed:${conclusion}" >> "$GITHUB_OUTPUT"

      - name: Publish observable Golden status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KLYX_GOLDEN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          KLYX_GOLDEN_RUN_ID: ${{ github.event.workflow_run.id }}
          KLYX_GOLDEN_WORKFLOW_STATE: ${{ steps.state.outputs.value }}
        run: node scripts/golden-path-main-status.mjs
