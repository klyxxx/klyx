name: KLYX Stripe Connect One Shot

on:
  push:
    branches:
      - test/stripe-connect-network-proof

permissions:
  contents: read

concurrency:
  group: klyx-stripe-connect-one-shot-${{ github.repository }}
  cancel-in-progress: false

jobs:
  connect-network-proof:
    name: Stripe Connect TEST one-shot proof
    if: ${{ github.ref == 'refs/heads/test/stripe-connect-network-proof' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 35

    env:
      KLYX_GOLDEN_PATH_MUTATIONS_ENABLED: "true"
      KLYX_GOLDEN_PATH_LOCAL_SUPABASE: "true"
      KLYX_PRODUCTION_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_TELEMETRY_DISABLED: "1"

      KLYX_STRIPE_MODE: "test"
      STRIPE_SECRET_KEY: ${{ secrets.KLYX_STRIPE_TEST_SECRET_KEY }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.KLYX_STRIPE_TEST_PUBLISHABLE_KEY }}
      KLYX_ALLOW_PLATFORM_ONLY_TEST_PAYMENTS: "true"
      KLYX_LIVE_PAYMENTS_ENABLED: "false"
      NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3100"

    steps:
      - name: Checkout proof branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refuse unsafe one-shot trigger
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/test/stripe-connect-network-proof" ]; then
            echo "::error::One-shot Connect proof is restricted to its dedicated branch."
            exit 1
          fi

          case "${STRIPE_SECRET_KEY:-}" in
            sk_test_*) ;;
            *) echo "::error::Connect proof requires KLYX_STRIPE_TEST_SECRET_KEY (sk_test_...)."; exit 1 ;;
          esac

          case "${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}" in
            pk_test_*) ;;
            *) echo "::error::Connect proof requires KLYX_STRIPE_TEST_PUBLISHABLE_KEY (pk_test_...)."; exit 1 ;;
          esac

          if [ "$KLYX_STRIPE_MODE" != "test" ] || [ "$KLYX_LIVE_PAYMENTS_ENABLED" != "false" ]; then
            echo "::error::Connect proof must remain Stripe TEST only."
            exit 1
          fi

          if [ -z "${KLYX_PRODUCTION_SUPABASE_URL:-}" ]; then
            echo "::error::Production Supabase comparison URL is missing."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.111.0

      - name: Initialize local Supabase config
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      - name: Start ephemeral local Supabase
        shell: bash
        run: |
          set -euo pipefail
          supabase start \
            -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Export ephemeral Supabase credentials
        shell: bash
        run: |
          set -euo pipefail

          eval "$(supabase status -o env)"
          local_public_key="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"

          for name in API_URL SERVICE_ROLE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Supabase local status did not provide ${name}."
              exit 1
            fi
          done

          if [ -z "$local_public_key" ]; then
            echo "::error::Supabase local status did not provide ANON_KEY/PUBLISHABLE_KEY."
            exit 1
          fi

          case "$API_URL" in
            http://127.0.0.1:54321|http://localhost:54321) ;;
            *) echo "::error::Refusing non-loopback Supabase API URL: ${API_URL}"; exit 1 ;;
          esac

          proof_email="stripe-connect-${GITHUB_RUN_ID}@example.test"
          proof_password="$(openssl rand -base64 36 | tr -d '\n')"
          webhook_secret="whsec_$(openssl rand -hex 32)"

          echo "::add-mask::$local_public_key"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "::add-mask::$proof_password"
          echo "::add-mask::$webhook_secret"

          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$local_public_key"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "KLYX_E2E_EMAIL=$proof_email"
            echo "KLYX_E2E_PASSWORD=$proof_password"
            echo "STRIPE_WEBHOOK_SECRET=$webhook_secret"
          } >> "$GITHUB_ENV"

      - name: Verify isolated runtime guards
        run: >-
          node --input-type=module -e
          "import('./scripts/golden-path-runtime.mjs').then(({assertGoldenPathIsolation}) => assertGoldenPathIsolation())"

      - name: Bootstrap dedicated Connect proof account
        run: node scripts/golden-path-bootstrap.mjs

      - name: Verify dedicated Connect proof account
        run: node scripts/golden-path-preflight.mjs

      - name: Verify Connect proof syntax
        run: node --check scripts/golden-path-stripe-connect-network.mjs

      - name: Production build
        run: npm run build

      - name: Start isolated KLYX production server
        shell: bash
        run: |
          set -euo pipefail

          npm run start -- -p 3100 > stripe-connect-network-server.log 2>&1 &
          server_pid=$!
          echo "KLYX_STRIPE_CONNECT_SERVER_PID=$server_pid" >> "$GITHUB_ENV"

          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:3100/login > /dev/null; then
              echo "Isolated KLYX Connect proof server is ready."
              exit 0
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "::error::Isolated Connect proof server exited early."
              cat stripe-connect-network-server.log
              exit 1
            fi

            sleep 1
          done

          echo "::error::Isolated Connect proof server did not become ready."
          cat stripe-connect-network-server.log
          exit 1

      - name: Verify real Stripe TEST Connect account lifecycle
        run: node scripts/golden-path-stripe-connect-network.mjs

      - name: Upload Connect network proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: klyx-stripe-connect-one-shot-${{ github.run_id }}
          path: stripe-network-proof/connect-proof.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop isolated KLYX server
        if: always()
        shell: bash
        run: |
          if [ -n "${KLYX_STRIPE_CONNECT_SERVER_PID:-}" ] && kill -0 "$KLYX_STRIPE_CONNECT_SERVER_PID" 2>/dev/null; then
            kill "$KLYX_STRIPE_CONNECT_SERVER_PID" || true
          fi

      - name: Destroy ephemeral local Supabase
        if: always()
        shell: bash
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup || true
          fi
