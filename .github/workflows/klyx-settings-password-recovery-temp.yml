name: KLYX temporary settings password recovery patch

on:
  push:
    branches:
      - security/settings-password-recovery-20260909

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/settings-password-recovery-20260909

      - name: Apply isolated settings password recovery hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          page_path = Path("app/settings/page.tsx")
          page = page_path.read_text(encoding="utf-8")

          if "KLYX_SETTINGS_PASSWORD_RECOVERY_20260909" not in page:
              page = replace_once(
                  page,
                  'import { FormEvent, useEffect, useState } from "react";',
                  'import { FormEvent, useEffect, useRef, useState } from "react";',
                  "react import",
              )

              page = replace_once(
                  page,
                  'import { useKlyxLocale } from "@/app/components/KlyxLocaleProvider";',
                  '''import AuthTurnstile, {
  AUTH_TURNSTILE_ENABLED,
  type AuthTurnstileHandle,
} from "@/app/components/AuthTurnstile";
import { useKlyxLocale } from "@/app/components/KlyxLocaleProvider";''',
                  "turnstile import",
              )

              page = replace_once(
                  page,
                  '''  const t = (key: KlyxSettingsPageMessageKey) =>
    translateKlyxSettingsPage(locale, key);

  const [loading, setLoading] = useState(true);''',
                  '''  const t = (key: KlyxSettingsPageMessageKey) =>
    translateKlyxSettingsPage(locale, key);
  const passwordCaptchaRef = useRef<AuthTurnstileHandle | null>(null);

  const [loading, setLoading] = useState(true);''',
                  "captcha ref",
              )

              page = replace_once(
                  page,
                  '''  const [newEmail, setNewEmail] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [deleteConfirmation, setDeleteConfirmation] = useState("");''',
                  '''  const [newEmail, setNewEmail] = useState("");
  const [passwordCaptchaToken, setPasswordCaptchaToken] = useState("");
  const [deleteConfirmation, setDeleteConfirmation] = useState("");''',
                  "password state",
              )

              function_pattern = re.compile(
                  r'  async function updatePassword\(event: FormEvent<HTMLFormElement>\) \{.*?\n  \}\n\n  function updateNotifications\(',
                  re.S,
              )
              function_replacement = '''  function resetPasswordCaptcha() {
    passwordCaptchaRef.current?.reset();
    setPasswordCaptchaToken("");
  }

  async function requestPasswordReset() {
    const normalizedEmail = email.trim().toLowerCase();

    if (!normalizedEmail) {
      failure("passwordResetFailed");
      return;
    }

    if (AUTH_TURNSTILE_ENABLED && !passwordCaptchaToken) {
      failure("passwordResetCaptchaRequired");
      return;
    }

    setSavingPassword(true);

    try {
      const supabase = createClient();
      const { error } = await supabase.auth.resetPasswordForEmail(
        normalizedEmail,
        {
          redirectTo: `${window.location.origin}/reset-password`,
          captchaToken: AUTH_TURNSTILE_ENABLED
            ? passwordCaptchaToken
            : undefined,
        }
      );

      if (error) {
        failure("passwordResetFailed");
        return;
      }

      success("passwordResetSent");
    } catch {
      failure("passwordResetFailed");
    } finally {
      resetPasswordCaptcha();
      setSavingPassword(false);
    }
  }

  function updateNotifications('''
              page, count = function_pattern.subn(function_replacement, page, count=1)
              if count != 1:
                  raise SystemExit(f"password handler: expected one match, got {count}")

              ui_pattern = re.compile(
                  r'''              <form\n                onSubmit=\{updatePassword\}\n                className="space-y-4 border-t border-border pt-6"\n              >.*?              </form>''',
                  re.S,
              )
              ui_replacement = '''              {/* KLYX_SETTINGS_PASSWORD_RECOVERY_20260909 */}
              <div className="space-y-4 border-t border-border pt-6">
                <AuthTurnstile
                  ref={passwordCaptchaRef}
                  action="password-reset"
                  onTokenChange={setPasswordCaptchaToken}
                />
                <button
                  type="button"
                  onClick={() => void requestPasswordReset()}
                  disabled={savingPassword}
                  className="inline-flex min-h-12 items-center gap-2 rounded-xl bg-blue-600 px-5 py-3 font-semibold text-white transition hover:bg-blue-500 disabled:opacity-60"
                >
                  {savingPassword && (
                    <LoaderCircle className="animate-spin" size={17} />
                  )}
                  {t("updatePassword")}
                </button>
              </div>'''
              page, count = ui_pattern.subn(ui_replacement, page, count=1)
              if count != 1:
                  raise SystemExit(f"password UI: expected one match, got {count}")

              page_path.write_text(page, encoding="utf-8")

          i18n_path = Path("lib/klyx-settings-page-i18n.ts")
          i18n = i18n_path.read_text(encoding="utf-8")

          if '"passwordResetSent"' not in i18n:
              i18n = replace_once(
                  i18n,
                  '  "updatePassword",\n  "notifications",',
                  '  "updatePassword",\n  "passwordResetSent",\n  "passwordResetCaptchaRequired",\n  "passwordResetFailed",\n  "notifications",',
                  "i18n key list",
              )
              replacements = [
                  (
                      '    updatePassword: "Modifier le mot de passe",',
                      '    updatePassword: "Changer mon mot de passe",\n    passwordResetSent: "Un lien sécurisé de changement de mot de passe a été envoyé à ton e-mail.",\n    passwordResetCaptchaRequired: "Valide la vérification anti-robot avant de continuer.",\n    passwordResetFailed: "Impossible d’envoyer le lien de changement de mot de passe.",',
                      "fr password messages",
                  ),
                  (
                      '    updatePassword: "Update password",',
                      '    updatePassword: "Change my password",\n    passwordResetSent: "A secure password-change link was sent to your email.",\n    passwordResetCaptchaRequired: "Complete the anti-bot verification before continuing.",\n    passwordResetFailed: "Unable to send the password-change link.",',
                      "en password messages",
                  ),
                  (
                      '    updatePassword: "Wachtwoord wijzigen",',
                      '    updatePassword: "Mijn wachtwoord wijzigen",\n    passwordResetSent: "Er is een beveiligde link om je wachtwoord te wijzigen naar je e-mailadres gestuurd.",\n    passwordResetCaptchaRequired: "Voltooi de anti-robotcontrole voordat je doorgaat.",\n    passwordResetFailed: "De link om het wachtwoord te wijzigen kan niet worden verzonden.",',
                      "nl password messages",
                  ),
                  (
                      '    updatePassword: "Passwort ändern",',
                      '    updatePassword: "Mein Passwort ändern",\n    passwordResetSent: "Ein sicherer Link zum Ändern des Passworts wurde an deine E-Mail-Adresse gesendet.",\n    passwordResetCaptchaRequired: "Schließe die Anti-Bot-Prüfung ab, bevor du fortfährst.",\n    passwordResetFailed: "Der Link zum Ändern des Passworts konnte nicht gesendet werden.",',
                      "de password messages",
                  ),
              ]
              for old, new, label in replacements:
                  i18n = replace_once(i18n, old, new, label)
              i18n_path.write_text(i18n, encoding="utf-8")

          test_path = Path("tests/integration/settings-password-reset-security-contract.test.ts")
          test_path.write_text(r'''import fs from "node:fs";
import path from "node:path";

import { describe, expect, it } from "vitest";

function read(relativePath: string) {
  return fs.readFileSync(path.join(process.cwd(), relativePath), "utf8");
}

describe("settings password reset security contract", () => {
  it("routes authenticated password changes through the protected recovery pipeline", () => {
    const settings = read("app/settings/page.tsx");
    const resetPage = read("app/reset-password/page.tsx");

    expect(settings).toContain("KLYX_SETTINGS_PASSWORD_RECOVERY_20260909");
    expect(settings).toContain("supabase.auth.resetPasswordForEmail(");
    expect(settings).toContain(
      "redirectTo: `${window.location.origin}/reset-password`"
    );
    expect(settings).toContain('action="password-reset"');
    expect(settings).toContain("AUTH_TURNSTILE_ENABLED");
    expect(settings).toContain("captchaToken: AUTH_TURNSTILE_ENABLED");
    expect(settings).toContain(
      "const normalizedEmail = email.trim().toLowerCase()"
    );

    expect(settings).not.toContain("const [newPassword");
    expect(settings).not.toContain("const [confirmPassword");
    expect(settings).not.toContain("password: newPassword");
    expect(settings).not.toMatch(
      /localStorage\.(?:setItem|getItem)\([^\n]*password/i
    );

    expect(resetPage).toContain("supabase.auth.updateUser({ password })");
  });
});
''', encoding="utf-8")
          PY

      - name: Commit isolated security patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "klyxxx"
          git config user.email "yeswork2711@gmail.com"
          git add app/settings/page.tsx lib/klyx-settings-page-i18n.ts tests/integration/settings-password-reset-security-contract.test.ts
          git commit -m "fix(settings): route password changes through recovery"
          git push origin HEAD:security/settings-password-recovery-20260909
