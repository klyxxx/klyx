name: KLYX Settlement Recovery Certification Dispatch

on:
  push:
    branches:
      - "feature/settlement-recovery-reconciliation-*"

permissions:
  contents: read
  actions: write
  statuses: write

jobs:
  certify-and-dispatch:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Unit and integration tests
        run: npm test

      - name: TypeScript safety check
        run: npx tsc --noEmit --pretty false

      - name: Production build
        run: npm run build

      - name: Dispatch and await exact Recovery verification workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KLYX_REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          report_status() {
            local state="$1"
            local description="$2"
            gh api \
              --method POST \
              "repos/$GH_REPO/statuses/$GITHUB_SHA" \
              -f state="$state" \
              -f context="klyx/settlement-recovery-exact-certification" \
              -f description="$description" >/dev/null
          }

          fail_status() {
            report_status failure "Exact settlement recovery certification failed"
          }
          trap fail_status ERR

          checked_out_sha="$(git rev-parse HEAD)"
          if [ "$checked_out_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Recovery dispatcher checkout SHA mismatch: expected $GITHUB_SHA, got $checked_out_sha."
            exit 1
          fi

          report_status pending "Exact settlement recovery certification running"

          wait_workflow_idle() {
            local workflow="$1"
            local active=""

            for attempt in $(seq 1 180); do
              active="$(
                gh run list \
                  --repo "$GH_REPO" \
                  --workflow "$workflow" \
                  --limit 50 \
                  --json status \
                  --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "pending" or .status == "waiting" or .status == "requested")] | length'
              )"

              if [ "$active" = "0" ]; then
                return 0
              fi

              echo "Waiting for $workflow concurrency queue to drain ($active active/pending run(s))."
              sleep 5
            done

            echo "::error::Timed out waiting for $workflow concurrency queue to drain."
            return 1
          }

          dispatch_and_wait() {
            local workflow="$1"
            shift

            wait_workflow_idle "$workflow"

            local before_file
            before_file="$(mktemp)"

            gh run list \
              --repo "$GH_REPO" \
              --workflow "$workflow" \
              --commit "$GITHUB_SHA" \
              --event workflow_dispatch \
              --limit 50 \
              --json databaseId \
              --jq '.[].databaseId' \
              > "$before_file"

            gh workflow run "$workflow" \
              --repo "$GH_REPO" \
              --ref "$KLYX_REF" \
              -f expected_sha="$GITHUB_SHA" \
              "$@"

            local run_id=""
            local candidate=""

            for attempt in $(seq 1 60); do
              while IFS= read -r candidate; do
                if [ -n "$candidate" ] && ! grep -Fxq "$candidate" "$before_file"; then
                  run_id="$candidate"
                  break
                fi
              done < <(
                gh run list \
                  --repo "$GH_REPO" \
                  --workflow "$workflow" \
                  --commit "$GITHUB_SHA" \
                  --event workflow_dispatch \
                  --limit 50 \
                  --json databaseId \
                  --jq '.[].databaseId'
              )

              if [ -n "$run_id" ]; then
                break
              fi

              sleep 2
            done

            rm -f "$before_file"

            if [ -z "$run_id" ]; then
              echo "::error::No new workflow_dispatch run found for $workflow at $GITHUB_SHA."
              return 1
            fi

            echo "Awaiting exact $workflow run $run_id for $GITHUB_SHA"
            gh run watch "$run_id" --repo "$GH_REPO" --exit-status
          }

          # Temporary diagnostic ordering on the certification branch only:
          # run the failing Stripe TEST proof first so database diagnostics are
          # available without waiting for already-green gates.
          dispatch_and_wait \
            klyx-stripe-network-test.yml \
            -f confirm_stripe_test_network=true

          dispatch_and_wait klyx-security.yml

          dispatch_and_wait \
            klyx-golden-path.yml \
            -f confirm_isolated_e2e=true

          dispatch_and_wait \
            klyx-performance.yml \
            -f profile=smoke \
            -f confirm_isolated_target=true

          dispatch_and_wait klyx-e2e.yml

          trap - ERR
          report_status success "Exact settlement recovery certification passed"
