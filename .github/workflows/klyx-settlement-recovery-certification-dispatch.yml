name: KLYX Settlement Recovery Certification Dispatch

on:
  push:
    branches:
      - "feature/settlement-recovery-reconciliation-*"

permissions:
  contents: read
  actions: write

jobs:
  certify-and-dispatch:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Unit and integration tests
        run: npm test

      - name: TypeScript safety check
        run: npx tsc --noEmit --pretty false

      - name: Production build
        run: npm run build

      - name: Dispatch exact Stripe TEST recovery proof
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KLYX_REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          checked_out_sha="$(git rev-parse HEAD)"
          if [ "$checked_out_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Recovery dispatcher checkout SHA mismatch: expected $GITHUB_SHA, got $checked_out_sha."
            exit 1
          fi

          gh workflow run klyx-stripe-network-test.yml \
            --repo "$GH_REPO" \
            --ref "$KLYX_REF" \
            -f expected_sha="$GITHUB_SHA" \
            -f confirm_stripe_test_network=true
