name: KLYX Security Certification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Immutable commit SHA expected by the #803 certification dispatcher"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: klyx-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-certification:
    name: Security Certification
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Verify immutable certification SHA
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha != '' }}
        shell: bash
        env:
          KLYX_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$KLYX_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid expected certification SHA."
            exit 1
          fi
          if [ "$GITHUB_SHA" != "$KLYX_EXPECTED_SHA" ]; then
            echo "::error::Certification SHA mismatch: expected $KLYX_EXPECTED_SHA, got $GITHUB_SHA."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: KLYX repository security audit
        run: node scripts/security/security-audit.mjs

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: TypeScript safety check
        run: npx tsc --noEmit --pretty false
