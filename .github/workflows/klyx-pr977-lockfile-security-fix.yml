name: KLYX PR977 Lockfile Security Fix

on:
  push:
    branches:
      - agent/dr-automated-offsite-retry-20260929

permissions:
  contents: write

jobs:
  fix-lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[lockfix]') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/dr-automated-offsite-retry-20260929
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate minimal production audit fix in lockfile
        run: npm audit fix --package-lock-only --omit=dev

      - name: Verify production dependency security
        run: npm audit --omit=dev --audit-level=moderate

      - name: Refuse scope expansion
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo "No lockfile update required."
            exit 0
          fi
          if [ "$changed" != "package-lock.json" ]; then
            echo "Unexpected files changed:"
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Commit audited lockfile only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): clear production audit blockers [lockfix] [skip ci]"
          git push origin HEAD:agent/dr-automated-offsite-retry-20260929
