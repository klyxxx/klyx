name: KLYX UX Rebaseline 760

on:
  push:
    branches:
      - ui/assistant-black-shell-20260912
    paths:
      - .github/workflows/klyx-ux-rebaseline-760.yml

permissions:
  contents: write

jobs:
  rebaseline:
    runs-on: ubuntu-22.04
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      KLYX_E2E_EMAIL: ${{ secrets.KLYX_E2E_EMAIL }}
      KLYX_E2E_SESSION_BOOTSTRAP: "1"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ui/assistant-black-shell-20260912
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate required environment
        shell: bash
        run: |
          set -euo pipefail
          for variable in \
            NEXT_PUBLIC_SUPABASE_URL \
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            SUPABASE_SERVICE_ROLE_KEY \
            KLYX_E2E_EMAIL
          do
            if [ -z "${!variable}" ]; then
              echo "$variable is missing"
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Playwright Chromium
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build

      - name: Refresh certified UX snapshots
        run: npx playwright test --config=playwright.ux-certification.config.ts --update-snapshots=all

      - name: Keep assistant baselines only
        shell: bash
        run: |
          set -euo pipefail
          desktop="tests/e2e/ux-visual-certification-snapshots/desktop-chromium/assistant-desktop.png"
          mobile="tests/e2e/ux-visual-certification-snapshots/mobile-chromium/assistant-mobile.png"

          while IFS= read -r -d '' file; do
            if [ "$file" != "$desktop" ] && [ "$file" != "$mobile" ]; then
              git checkout HEAD -- "$file"
            fi
          done < <(find tests/e2e/ux-visual-certification-snapshots -type f -name '*.png' -print0)

          changed="$(git diff --name-only -- tests/e2e/ux-visual-certification-snapshots | sort)"
          expected="$(printf '%s\n%s\n' "$desktop" "$mobile" | sort)"
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected snapshot diff:"
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Validate refreshed PNGs
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import struct
          import zlib
          from pathlib import Path

          paths = [
              Path('tests/e2e/ux-visual-certification-snapshots/desktop-chromium/assistant-desktop.png'),
              Path('tests/e2e/ux-visual-certification-snapshots/mobile-chromium/assistant-mobile.png'),
          ]

          for path in paths:
              data = path.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{path}: invalid PNG signature')
              offset = 8
              saw_iend = False
              while offset + 12 <= len(data):
                  length = struct.unpack('>I', data[offset:offset + 4])[0]
                  chunk_type = data[offset + 4:offset + 8]
                  end = offset + 12 + length
                  if end > len(data):
                      raise SystemExit(f'{path}: truncated PNG chunk')
                  payload = data[offset + 8:offset + 8 + length]
                  expected_crc = struct.unpack('>I', data[offset + 8 + length:end])[0]
                  actual_crc = zlib.crc32(chunk_type)
                  actual_crc = zlib.crc32(payload, actual_crc) & 0xffffffff
                  if actual_crc != expected_crc:
                      raise SystemExit(f'{path}: PNG CRC mismatch')
                  offset = end
                  if chunk_type == b'IEND':
                      saw_iend = True
                      break
              if not saw_iend:
                  raise SystemExit(f'{path}: missing IEND')
              print(f'{path}: valid PNG ({len(data)} bytes)')
          PY

      - name: Guard service-role leakage
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import os
          from pathlib import Path

          secret = os.environ['SUPABASE_SERVICE_ROLE_KEY'].encode('utf-8')
          for path in [
              Path('tests/e2e/ux-visual-certification-snapshots/desktop-chromium/assistant-desktop.png'),
              Path('tests/e2e/ux-visual-certification-snapshots/mobile-chromium/assistant-mobile.png'),
          ]:
              if secret in path.read_bytes():
                  raise SystemExit(f'sensitive credential detected in {path}')
          print('Snapshot secret scan: PASS')
          PY

      - name: Commit clean baseline update and self-clean
        shell: bash
        run: |
          set -euo pipefail
          desktop="tests/e2e/ux-visual-certification-snapshots/desktop-chromium/assistant-desktop.png"
          mobile="tests/e2e/ux-visual-certification-snapshots/mobile-chromium/assistant-mobile.png"
          workflow=".github/workflows/klyx-ux-rebaseline-760.yml"

          rm "$workflow"
          git config user.name "klyxxx"
          git config user.email "yeswork2711@gmail.com"
          git add "$desktop" "$mobile" "$workflow"

          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n%s\n%s\n' "$workflow" "$desktop" "$mobile" | sort)"
          if [ "$staged" != "$expected" ]; then
            echo "Unexpected staged diff:"
            printf '%s\n' "$staged"
            exit 1
          fi

          git commit -m "test: refresh assistant visual baselines"
          git push origin HEAD:ui/assistant-black-shell-20260912
