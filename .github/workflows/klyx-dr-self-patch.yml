name: KLYX DR Self Patch

on:
  push:
    branches:
      - agent/dr-git-hardening-20260929
    paths:
      - .github/workflows/klyx-dr-self-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: agent/dr-git-hardening-20260929
          fetch-depth: 0

      - name: Patch DR scripts fail-closed
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          backup_path = Path('scripts/backup-klyx-supabase-dr.ps1')
          backup = backup_path.read_text(encoding='utf-8-sig')

          old_backup = '''function Invoke-KlyxSupabase {
              param(
                  [Parameter(Mandatory = $true)]
                  [string[]]$Arguments,

                  [Parameter(Mandatory = $true)]
                  [string]$Label
              )

              & $script:SupabaseExecutable @Arguments

              if ($LASTEXITCODE -ne 0) {
                  throw "$Label FAILED."
              }
          }
          '''

          new_backup = '''function Invoke-KlyxSupabase {
              param(
                  [Parameter(Mandatory = $true)]
                  [string[]]$Arguments,

                  [Parameter(Mandatory = $true)]
                  [string]$Label,

                  [ValidateRange(1, 8)]
                  [int]$MaxAttempts = 4
              )

              $DelaySeconds = 2

              for ($Attempt = 1; $Attempt -le $MaxAttempts; $Attempt++) {
                  & $script:SupabaseExecutable @Arguments

                  if ($LASTEXITCODE -eq 0) {
                      if ($Attempt -gt 1) {
                          Write-Host "$Label recovered on attempt $Attempt/$MaxAttempts."
                      }

                      return
                  }

                  if ($Attempt -ge $MaxAttempts) {
                      throw "$Label FAILED after $MaxAttempts bounded attempts."
                  }

                  Write-Warning (
                      "$Label failed on attempt $Attempt/$MaxAttempts. " +
                      "Retrying in $DelaySeconds seconds."
                  )

                  Start-Sleep -Seconds $DelaySeconds
                  $DelaySeconds = [Math]::Min($DelaySeconds * 2, 16)
              }
          }
          '''

          if backup.count(old_backup) != 1:
              raise SystemExit('Expected Invoke-KlyxSupabase block not found exactly once')
          backup = backup.replace(old_backup, new_backup, 1)
          backup_path.write_text(backup, encoding='utf-8')

          restore_path = Path('scripts/test-klyx-supabase-dr-restore.ps1')
          restore = restore_path.read_text(encoding='utf-8-sig')

          old_restore = '''if (-not $ArchivePath) {
              $Latest =
                  Get-ChildItem `
                      -LiteralPath $ArchiveDirectory `
                      -Filter "*.klyxdr" `
                      -File `
                      -ErrorAction SilentlyContinue |
                  Sort-Object `
                      LastWriteTimeUtc `
                      -Descending |
                  Select-Object `
                      -First 1

              if (-not $Latest) {
                  throw "No KLYX DR archive found."
              }

              $ArchivePath =
                  $Latest.FullName
          }
          '''

          new_restore = '''if (-not $ArchivePath) {
              if ($ExpectedCommit) {
                  $NormalizedExpectedCommit =
                      $ExpectedCommit.Trim().ToLowerInvariant()

                  if (
                      $NormalizedExpectedCommit -notmatch
                      '^[a-f0-9]{40}$'
                  ) {
                      throw "ExpectedCommit must be a full 40-character Git SHA."
                  }

                  $ExpectedShortCommit =
                      $NormalizedExpectedCommit.Substring(0, 8)

                  $Latest =
                      Get-ChildItem `
                          -LiteralPath $ArchiveDirectory `
                          -Filter "*-$ExpectedShortCommit.klyxdr" `
                          -File `
                          -ErrorAction SilentlyContinue |
                      Sort-Object `
                          LastWriteTimeUtc `
                          -Descending |
                      Select-Object `
                          -First 1

                  if (-not $Latest) {
                      throw (
                          "No KLYX DR archive found for expected commit " +
                          "$NormalizedExpectedCommit. Stale fallback refused."
                      )
                  }
              }
              else {
                  $Latest =
                      Get-ChildItem `
                          -LiteralPath $ArchiveDirectory `
                          -Filter "*.klyxdr" `
                          -File `
                          -ErrorAction SilentlyContinue |
                      Sort-Object `
                          LastWriteTimeUtc `
                          -Descending |
                      Select-Object `
                          -First 1

                  if (-not $Latest) {
                      throw "No KLYX DR archive found."
                  }
              }

              $ArchivePath =
                  $Latest.FullName
          }
          '''

          if restore.count(old_restore) != 1:
              raise SystemExit('Expected archive fallback block not found exactly once')
          restore = restore.replace(old_restore, new_restore, 1)
          restore_path.write_text(restore, encoding='utf-8')

          if 'FAILED after $MaxAttempts bounded attempts' not in backup:
              raise SystemExit('Bounded retry guard missing')
          if 'Stale fallback refused' not in restore:
              raise SystemExit('Exact-SHA stale archive guard missing')
          PY

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './scripts/backup-klyx-supabase-dr.ps1'),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; throw 'Backup script syntax invalid.' }

          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './scripts/test-klyx-supabase-dr-restore.ps1'),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; throw 'Restore script syntax invalid.' }

      - name: Commit hardened scripts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/backup-klyx-supabase-dr.ps1 scripts/test-klyx-supabase-dr-restore.ps1
          git diff --cached --check
          git commit -m 'fix(dr): retry Supabase dumps and refuse stale archive fallback'
          git push origin HEAD:agent/dr-git-hardening-20260929
