name: KLYX DR Offsite Backup

on:
  workflow_run:
    workflows:
      - "KLYX Supabase Full Restore Drill"
    types:
      - completed
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact main SHA certified by the successful Full Restore Drill"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: klyx-dr-offsite-backup-${{ github.repository }}
  cancel-in-progress: false

jobs:
  offsite-backup:
    name: Prepare encrypted exact-SHA offsite handoff
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    env:
      GH_TOKEN: ${{ github.token }}
      KLYX_TARGET_SHA: ${{ github.event.workflow_run.head_sha || inputs.target_sha || github.sha }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      KLYX_DR_SOURCE_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      KLYX_DR_SOURCE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      KLYX_DR_PUBLIC_KEY_PATH: ${{ github.workspace }}/config/dr/klyx-dr-recovery-public.pem
      SUPABASE_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout exact restore commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.KLYX_TARGET_SHA }}
          persist-credentials: false

      - name: Preflight exact SHA and read-only recovery authority
        shell: bash
        run: |
          set -euo pipefail

          if ! [[ "$KLYX_TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Target SHA is invalid."
            exit 1
          fi

          current_main="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [ "$current_main" != "$KLYX_TARGET_SHA" ]; then
            echo "::error::Offsite handoff refuses stale main."
            exit 1
          fi

          missing=()
          for name in SUPABASE_DB_URL KLYX_DR_SOURCE_SUPABASE_URL KLYX_DR_SOURCE_SERVICE_ROLE_KEY; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing required GitHub Actions secret: %s\n' "${missing[@]}"
            exit 1
          fi

          if [ ! -s "$KLYX_DR_PUBLIC_KEY_PATH" ]; then
            echo "::error::Committed DR public key is missing."
            exit 1
          fi

          openssl pkey -pubin -in "$KLYX_DR_PUBLIC_KEY_PATH" -noout >/dev/null
          echo "DR public key : PASS"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare safe offsite workspace
        shell: bash
        run: |
          set -euo pipefail

          effective_db_url="$(node <<'NODE'
          const raw = process.env.SUPABASE_DB_URL ?? "";
          const password = process.env.SUPABASE_DB_PASSWORD ?? "";
          let url;
          try {
            url = new URL(raw);
          } catch {
            console.error("SUPABASE_DB_URL is not a valid URL.");
            process.exit(2);
          }
          if (!["postgres:", "postgresql:"].includes(url.protocol)) {
            console.error("SUPABASE_DB_URL must be PostgreSQL.");
            process.exit(2);
          }
          const host = url.hostname.toLowerCase();
          const valid = host.endsWith(".supabase.co") || host.endsWith(".pooler.supabase.com");
          if (!valid || ["127.0.0.1", "localhost", "[::1]"].includes(host)) {
            console.error("Source database must be a non-loopback Supabase host.");
            process.exit(3);
          }
          if (password) url.password = password;
          if (!url.password) {
            console.error("Source database password is missing.");
            process.exit(4);
          }
          process.stdout.write(url.toString());
          NODE
          )"

          node <<'NODE'
          const raw = process.env.KLYX_DR_SOURCE_SUPABASE_URL ?? "";
          let url;
          try {
            url = new URL(raw);
          } catch {
            console.error("NEXT_PUBLIC_SUPABASE_URL is invalid.");
            process.exit(2);
          }
          const host = url.hostname.toLowerCase();
          const valid = url.protocol === "https:" &&
            (host.endsWith(".supabase.co") || host.endsWith(".supabase.com"));
          if (!valid || ["127.0.0.1", "localhost", "[::1]"].includes(host)) {
            console.error("Source Supabase API must be production HTTPS.");
            process.exit(3);
          }
          NODE

          echo "::add-mask::$effective_db_url"
          echo "::add-mask::$KLYX_DR_SOURCE_SERVICE_ROLE_KEY"
          echo "KLYX_DR_SOURCE_DB_URL=$effective_db_url" >> "$GITHUB_ENV"

          work_root="${RUNNER_TEMP}/klyx-offsite-dr-${GITHUB_RUN_ID}"
          snapshot_root="${work_root}/snapshot"
          db_root="${snapshot_root}/database"
          storage_root="${snapshot_root}/storage"
          handoff_root="${GITHUB_WORKSPACE}/offsite-handoff"
          mkdir -p "$db_root" "$storage_root" "$handoff_root"
          chmod 700 "$work_root" "$snapshot_root" "$db_root" "$storage_root" "$handoff_root"

          {
            echo "KLYX_OFFSITE_WORK_ROOT=$work_root"
            echo "KLYX_OFFSITE_DB_ROOT=$db_root"
            echo "KLYX_OFFSITE_STORAGE_ROOT=$storage_root"
            echo "KLYX_OFFSITE_HANDOFF_ROOT=$handoff_root"
          } >> "$GITHUB_ENV"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.111.0

      - name: Capture production Auth and Storage snapshot
        shell: bash
        run: |
          set -euo pipefail
          node scripts/backup-klyx-storage.mjs "$KLYX_OFFSITE_STORAGE_ROOT"
          test -s "$KLYX_OFFSITE_STORAGE_ROOT/storage-manifest.json"
          test -s "$KLYX_OFFSITE_STORAGE_ROOT/state-manifest.json"

      - name: Capture production logical database snapshot with bounded retry
        shell: bash
        run: |
          set -euo pipefail

          dump_with_retry() {
            local label="$1"
            local output="$2"
            shift 2
            local attempt=1
            local max_attempts=4
            local delays=(5 15 30)

            while true; do
              rm -f -- "$output"
              echo "${label}: attempt ${attempt}/${max_attempts}"

              if "$@" -f "$output" && test -s "$output"; then
                echo "${label}: PASS"
                return 0
              fi

              rm -f -- "$output"

              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "::error::${label} failed after ${max_attempts} attempts."
                return 1
              fi

              delay="${delays[$((attempt - 1))]}"
              echo "${label}: transient failure; retrying in ${delay}s"
              sleep "$delay"
              attempt=$((attempt + 1))
            done
          }

          dump_with_retry \
            "roles backup" \
            "$KLYX_OFFSITE_DB_ROOT/roles.sql" \
            supabase db dump --db-url "$KLYX_DR_SOURCE_DB_URL" --role-only

          dump_with_retry \
            "application schema backup" \
            "$KLYX_OFFSITE_DB_ROOT/application-schema.sql" \
            supabase db dump --db-url "$KLYX_DR_SOURCE_DB_URL" --schema public,klyx_private

          dump_with_retry \
            "application data backup" \
            "$KLYX_OFFSITE_DB_ROOT/application-data.sql" \
            supabase db dump --db-url "$KLYX_DR_SOURCE_DB_URL" --schema public,klyx_private --data-only --use-copy

          dump_with_retry \
            "auth schema backup" \
            "$KLYX_OFFSITE_DB_ROOT/auth-schema.sql" \
            supabase db dump --db-url "$KLYX_DR_SOURCE_DB_URL" --schema auth

          dump_with_retry \
            "auth data backup" \
            "$KLYX_OFFSITE_DB_ROOT/auth-data.sql" \
            supabase db dump --db-url "$KLYX_DR_SOURCE_DB_URL" --schema auth --data-only --use-copy

          dump_with_retry \
            "migration history schema backup" \
            "$KLYX_OFFSITE_DB_ROOT/migration-history-schema.sql" \
            supabase db dump --db-url "$KLYX_DR_SOURCE_DB_URL" --schema supabase_migrations

          dump_with_retry \
            "migration history data backup" \
            "$KLYX_OFFSITE_DB_ROOT/migration-history-data.sql" \
            supabase db dump --db-url "$KLYX_DR_SOURCE_DB_URL" --schema supabase_migrations --data-only --use-copy

          for file in \
            roles.sql \
            application-schema.sql \
            application-data.sql \
            auth-schema.sql \
            auth-data.sql \
            migration-history-schema.sql \
            migration-history-data.sql; do
            test -s "$KLYX_OFFSITE_DB_ROOT/$file"
          done

      - name: Build and encrypt exact-SHA recovery archive
        shell: bash
        run: |
          set -euo pipefail

          checkout_sha="$(git rev-parse HEAD)"
          if [ "$checkout_sha" != "$KLYX_TARGET_SHA" ]; then
            echo "::error::Checkout SHA drifted before archive creation."
            exit 1
          fi

          created_utc="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > "$KLYX_OFFSITE_WORK_ROOT/backup-manifest.json" <<EOF
          {
            "format": "KLYX_DR_AUTOMATED_OFFSITE_SNAPSHOT",
            "version": 2,
            "gitCommit": "${KLYX_TARGET_SHA}",
            "createdUtc": "${created_utc}",
            "source": "supabase_production_read_only",
            "productionWrite": false,
            "plaintextUploaded": false
          }
          EOF

          node - "$KLYX_TARGET_SHA" "$KLYX_OFFSITE_WORK_ROOT/backup-manifest.json" <<'NODE'
          const fs = require("node:fs");
          const expected = process.argv[2];
          const manifest = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          if (manifest.gitCommit !== expected) process.exit(2);
          if (manifest.productionWrite !== false) process.exit(3);
          if (manifest.plaintextUploaded !== false) process.exit(4);
          NODE

          plain_archive="$KLYX_OFFSITE_WORK_ROOT/klyx-dr-plain.tar.gz"
          tar -czf "$plain_archive" \
            -C "$KLYX_OFFSITE_WORK_ROOT" \
            snapshot backup-manifest.json

          timestamp="$(date -u +%Y%m%d-%H%M%S)"
          short_sha="${KLYX_TARGET_SHA:0:8}"
          encrypted_archive="$KLYX_OFFSITE_WORK_ROOT/klyx-dr-${timestamp}-${short_sha}.klyxdr"

          node scripts/encrypt-klyx-dr-envelope.mjs "$plain_archive" "$encrypted_archive"
          rm -f -- "$plain_archive"

          if [ "$(head -c 8 "$encrypted_archive")" != "KLYXDR02" ]; then
            echo "::error::Encrypted archive is not KLYXDR02."
            exit 1
          fi

          archive_name="$(basename "$encrypted_archive")"
          if [[ "$archive_name" != *"-${short_sha}.klyxdr" ]]; then
            echo "::error::Encrypted archive name is not bound to the expected SHA."
            exit 1
          fi

          archive_sha="$(sha256sum "$encrypted_archive" | awk '{print tolower($1)}')"
          public_key_sha="$(sha256sum "$KLYX_DR_PUBLIC_KEY_PATH" | awk '{print tolower($1)}')"
          cp "$encrypted_archive" "$KLYX_OFFSITE_HANDOFF_ROOT/$archive_name"

          cat > "$KLYX_OFFSITE_HANDOFF_ROOT/proof.json" <<EOF
          {
            "format": "KLYX_DR_CONNECTOR_HANDOFF_PROOF",
            "version": 1,
            "gitCommit": "${KLYX_TARGET_SHA}",
            "createdUtc": "${created_utc}",
            "archiveFileName": "${archive_name}",
            "archiveSha256": "${archive_sha}",
            "publicKeySha256": "${public_key_sha}",
            "encryptionFormat": "KLYXDR02",
            "providerTarget": "dropbox",
            "handoffRequired": true,
            "productionWrite": false,
            "plaintextUploaded": false,
            "privateRecoveryKeyPresent": false
          }
          EOF

          node - "$KLYX_TARGET_SHA" "$KLYX_OFFSITE_HANDOFF_ROOT/proof.json" "$KLYX_OFFSITE_HANDOFF_ROOT/$archive_name" <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const expected = process.argv[2];
          const proof = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          const bytes = fs.readFileSync(process.argv[4]);
          const digest = crypto.createHash("sha256").update(bytes).digest("hex");
          if (proof.format !== "KLYX_DR_CONNECTOR_HANDOFF_PROOF") process.exit(2);
          if (proof.gitCommit !== expected) process.exit(3);
          if (proof.archiveSha256 !== digest) process.exit(4);
          if (proof.encryptionFormat !== "KLYXDR02") process.exit(5);
          if (proof.productionWrite !== false) process.exit(6);
          if (proof.plaintextUploaded !== false) process.exit(7);
          if (proof.privateRecoveryKeyPresent !== false) process.exit(8);
          if (bytes.subarray(0, 8).toString("ascii") !== "KLYXDR02") process.exit(9);
          NODE

          echo "Encrypted connector handoff : PASS"

      - name: Upload encrypted connector handoff artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: klyx-dr-connector-handoff-${{ github.run_id }}
          path: offsite-handoff/
          if-no-files-found: error
          retention-days: 3

      - name: Destroy sensitive runner material
        if: always()
        shell: bash
        run: |
          set +e
          unset KLYX_DR_SOURCE_DB_URL
          unset KLYX_DR_SOURCE_SERVICE_ROLE_KEY
          if [ -n "${KLYX_OFFSITE_WORK_ROOT:-}" ] && [ -d "$KLYX_OFFSITE_WORK_ROOT" ]; then
            rm -rf -- "$KLYX_OFFSITE_WORK_ROOT"
          fi
