name: KLYX Zero Cost Test Diagnostic

on:
  push:
    branches:
      - feature/zero-cost-control-plane

permissions:
  contents: read

jobs:
  vitest-diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest JSON diagnostic
        id: vitest
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx vitest run --reporter=json --outputFile=zero-cost-vitest-report.json
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Vitest diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-cost-vitest-report-${{ github.run_id }}
          path: zero-cost-vitest-report.json
          if-no-files-found: error
          retention-days: 3

      - name: Fail if Vitest failed
        if: steps.vitest.outputs.exit_code != '0'
        run: exit 1
