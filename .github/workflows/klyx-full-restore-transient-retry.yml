name: KLYX Full Restore Transient Retry

on:
  workflow_run:
    workflows:
      - "KLYX Supabase Full Restore Drill"
    types:
      - completed

permissions:
  contents: read
  actions: write

concurrency:
  group: klyx-full-restore-transient-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry-transient-failure:
    name: Rerun exact-SHA full restore only for bounded transient failures
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    env:
      GH_TOKEN: ${{ github.token }}
      FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
      FAILED_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      FAILED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Refuse stale main or exhausted retry budget
        shell: bash
        run: |
          set -euo pipefail

          if ! [[ "$FAILED_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Invalid failed workflow head SHA."
            exit 1
          fi

          current_main="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha' | tr '[:upper:]' '[:lower:]')"
          failed_sha="$(printf '%s' "$FAILED_HEAD_SHA" | tr '[:upper:]' '[:lower:]')"

          if [ "$current_main" != "$failed_sha" ]; then
            echo "Stale Full Restore failure; no retry."
            exit 0
          fi

          if [ "$FAILED_RUN_ATTEMPT" -ge 3 ]; then
            echo "Full Restore transient retry budget exhausted at attempt $FAILED_RUN_ATTEMPT."
            exit 0
          fi

      - name: Prove failure is transient
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          logs_zip="${RUNNER_TEMP}/klyx-full-restore-${FAILED_RUN_ID}.zip"
          logs_txt="${RUNNER_TEMP}/klyx-full-restore-${FAILED_RUN_ID}.log"

          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN_ID}/logs" > "$logs_zip"
          unzip -p "$logs_zip" > "$logs_txt"

          transient_pattern='server closed the connection unexpectedly|could not connect|connection (reset|refused|timed out)|timeout|temporary failure|network is unreachable|unexpected eof|eof detected|tls handshake timeout|context deadline exceeded|HTTP[[:space:]]+5[0-9][0-9]|toomanyrequests|(^|[^0-9])429([^0-9]|$)|57P0[123]|0800[0136]|53300|too many connections|remaining connection slots are reserved'

          if ! grep -Eqi "$transient_pattern" "$logs_txt"; then
            echo "Failure is not classified as transient; refusing automatic rerun."
            echo "transient=false" >> "$GITHUB_OUTPUT"
            rm -f -- "$logs_zip" "$logs_txt"
            exit 0
          fi

          echo "transient=true" >> "$GITHUB_OUTPUT"
          rm -f -- "$logs_zip" "$logs_txt"

      - name: Rerun failed exact-SHA Full Restore
        if: steps.classify.outputs.transient == 'true'
        shell: bash
        run: |
          set -euo pipefail

          current_main="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha' | tr '[:upper:]' '[:lower:]')"
          failed_sha="$(printf '%s' "$FAILED_HEAD_SHA" | tr '[:upper:]' '[:lower:]')"

          if [ "$current_main" != "$failed_sha" ]; then
            echo "::error::main advanced before retry; refusing stale rerun."
            exit 1
          fi

          gh api \
            --method POST \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN_ID}/rerun"

          echo "Requested bounded rerun for Full Restore run ${FAILED_RUN_ID}, attempt ${FAILED_RUN_ATTEMPT}."
