name: KLYX Unified Shell History Patch

on:
  push:
    branches:
      - feat/unified-assistant-obtain-earn-20260912
    paths:
      - .github/workflows/klyx-unified-shell-history-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unified-assistant-obtain-earn-20260912
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/klyx-unified-shell-history-patch.py

      - name: Verify and self-delete
        run: |
          git diff --check
          rm scripts/klyx-unified-shell-history-patch.py
          rm .github/workflows/klyx-unified-shell-history-patch.yml
          git status --short

      - name: Commit patch
        run: |
          git config user.name "klyxxx"
          git config user.email "yeswork2711@gmail.com"
          git add app lib scripts .github/workflows/klyx-unified-shell-history-patch.yml
          git commit -m "refactor: unify assistant shell links and mission history"
          git push origin HEAD:feat/unified-assistant-obtain-earn-20260912
