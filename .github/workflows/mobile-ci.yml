name: KLYX Mobile Verification

on:
  push:
    branches:
      - codex/mobile-unified-product
  pull_request:
    paths:
      - "mobile/**"
      - "tests/unit/mobile-release-contract.test.ts"
      - ".github/workflows/mobile-ci.yml"

permissions:
  contents: write

jobs:
  verify-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
        if: ${{ hashFiles('mobile/package-lock.json') != '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
        if: ${{ hashFiles('mobile/package-lock.json') == '' }}

      - name: Generate dependency lock when missing
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install locked mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Typecheck mobile
        working-directory: mobile
        run: npm run typecheck

      - name: Expo Doctor
        working-directory: mobile
        run: npx expo-doctor@latest

      - name: Commit generated mobile lock
        if: ${{ github.event_name == 'push' && github.actor != 'github-actions[bot]' }}
        run: |
          if git diff --quiet -- mobile/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json
          git commit -m "chore(mobile): lock Expo dependencies"
          git push
