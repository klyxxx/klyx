name: KLYX UX Rebaseline #747

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  rebaseline:
    if: ${{ github.head_ref == 'ui/account-rail-compact-menu-20260912' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      KLYX_E2E_EMAIL: ${{ secrets.KLYX_E2E_EMAIL }}
      KLYX_E2E_SESSION_BOOTSTRAP: "1"
      KLYX_BRANCH: ${{ github.head_ref }}

    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate required environment
        shell: bash
        run: |
          for variable in \
            NEXT_PUBLIC_SUPABASE_URL \
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            SUPABASE_SERVICE_ROLE_KEY \
            KLYX_E2E_EMAIL
          do
            if [ -z "${!variable}" ]; then
              echo "$variable is missing"
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Playwright Chromium
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build

      - name: Regenerate references with official certification
        run: npx playwright test --config=playwright.ux-certification.config.ts --update-snapshots=all

      - name: Keep only the five human-verified desktop references
        shell: bash
        run: |
          git restore -- tests/e2e/ux-visual-certification-snapshots/mobile-chromium

          python <<'PY'
          import subprocess

          expected = {
              "tests/e2e/ux-visual-certification-snapshots/desktop-chromium/assistant-desktop.png",
              "tests/e2e/ux-visual-certification-snapshots/desktop-chromium/profile-desktop.png",
              "tests/e2e/ux-visual-certification-snapshots/desktop-chromium/settings-desktop.png",
              "tests/e2e/ux-visual-certification-snapshots/desktop-chromium/request-photo-desktop.png",
              "tests/e2e/ux-visual-certification-snapshots/desktop-chromium/active-mission-desktop.png",
          }
          changed = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True)
              .strip()
              .splitlines()
          )
          if changed != expected:
              raise SystemExit(
                  "Unexpected rebaseline scope: " + ", ".join(sorted(changed))
              )
          print("Rebaseline scope verified: exactly five desktop references")
          PY

      - name: Validate regenerated PNG integrity
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import struct
          import zlib

          paths = [
              Path("tests/e2e/ux-visual-certification-snapshots/desktop-chromium/assistant-desktop.png"),
              Path("tests/e2e/ux-visual-certification-snapshots/desktop-chromium/profile-desktop.png"),
              Path("tests/e2e/ux-visual-certification-snapshots/desktop-chromium/settings-desktop.png"),
              Path("tests/e2e/ux-visual-certification-snapshots/desktop-chromium/request-photo-desktop.png"),
              Path("tests/e2e/ux-visual-certification-snapshots/desktop-chromium/active-mission-desktop.png"),
          ]

          def validate_png(path: Path) -> None:
              data = path.read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"invalid PNG signature: {path}")

              offset = 8
              saw_iend = False
              while offset < len(data):
                  if offset + 12 > len(data):
                      raise SystemExit(f"truncated PNG chunk: {path}")
                  length = struct.unpack(">I", data[offset:offset + 4])[0]
                  chunk_type = data[offset + 4:offset + 8]
                  end = offset + 12 + length
                  if end > len(data):
                      raise SystemExit(f"truncated PNG payload: {path}")
                  payload = data[offset + 8:offset + 8 + length]
                  expected_crc = struct.unpack(">I", data[offset + 8 + length:end])[0]
                  actual_crc = zlib.crc32(chunk_type + payload) & 0xFFFFFFFF
                  if actual_crc != expected_crc:
                      raise SystemExit(f"PNG CRC mismatch: {path}")
                  offset = end
                  if chunk_type == b"IEND":
                      if length != 0 or offset != len(data):
                          raise SystemExit(f"invalid PNG IEND: {path}")
                      saw_iend = True
                      break

              if not saw_iend:
                  raise SystemExit(f"missing PNG IEND: {path}")
              print(f"valid PNG: {path}")

          for path in paths:
              validate_png(path)
          PY

      - name: Guard regenerated references against service-role leakage
        shell: bash
        run: |
          python <<'PY'
          import os
          import sys
          from pathlib import Path

          secret = os.environ.get("SUPABASE_SERVICE_ROLE_KEY", "").encode("utf-8")
          root = Path("tests/e2e/ux-visual-certification-snapshots/desktop-chromium")
          if not secret:
              sys.exit(1)
          for path in root.glob("*.png"):
              if secret in path.read_bytes():
                  print(f"Sensitive credential detected in {path}")
                  sys.exit(1)
          print("UX baseline secret scan: PASS")
          PY

      - name: Commit clean baseline-only result and remove temporary workflow
        shell: bash
        run: |
          git rm -f .github/workflows/klyx-ux-rebaseline-747.yml
          git add \
            tests/e2e/ux-visual-certification-snapshots/desktop-chromium/assistant-desktop.png \
            tests/e2e/ux-visual-certification-snapshots/desktop-chromium/profile-desktop.png \
            tests/e2e/ux-visual-certification-snapshots/desktop-chromium/settings-desktop.png \
            tests/e2e/ux-visual-certification-snapshots/desktop-chromium/request-photo-desktop.png \
            tests/e2e/ux-visual-certification-snapshots/desktop-chromium/active-mission-desktop.png

          python <<'PY'
          import subprocess

          expected = {
              ".github/workflows/klyx-ux-rebaseline-747.yml",
              "tests/e2e/ux-visual-certification-snapshots/desktop-chromium/assistant-desktop.png",
              "tests/e2e/ux-visual-certification-snapshots/desktop-chromium/profile-desktop.png",
              "tests/e2e/ux-visual-certification-snapshots/desktop-chromium/settings-desktop.png",
              "tests/e2e/ux-visual-certification-snapshots/desktop-chromium/request-photo-desktop.png",
              "tests/e2e/ux-visual-certification-snapshots/desktop-chromium/active-mission-desktop.png",
          }
          staged = set(
              subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only"], text=True
              )
              .strip()
              .splitlines()
          )
          if staged != expected:
              raise SystemExit(
                  "Unexpected staged rebaseline scope: " + ", ".join(sorted(staged))
              )
          print("Final staged scope verified")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(ux): refresh verified account-menu desktop baselines"
          git push origin "HEAD:${KLYX_BRANCH}"