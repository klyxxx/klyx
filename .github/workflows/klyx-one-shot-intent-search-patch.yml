name: KLYX one-shot intent search golden path patch

on:
  push:
    branches:
      - test/golden-path-analyze-search

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/golden-path-analyze-search

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch golden path intent and search proof
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = '.github/workflows/klyx-golden-path.yml';
          let text = fs.readFileSync(path, 'utf8');

          const webhookPath = '      - "app/api/stripe/webhook/**"\n';
          const extraPaths = '      - "app/api/requests/analyze/**"\n      - "app/api/search/providers/**"\n';
          if (!text.includes('      - "app/api/requests/analyze/**"')) {
            if (!text.includes(webhookPath)) throw new Error('workflow path anchor missing');
            text = text.replace(webhookPath, webhookPath + extraPaths);
          }

          const quoteStep = '      - name: Verify client quote and booking lifecycle\n        run: node scripts/golden-path-client-lifecycle.mjs\n';
          const intentStep = '      - name: Verify natural-language intent and exact provider search\n        run: node scripts/golden-path-intent-search.mjs\n\n';
          if (!text.includes('node scripts/golden-path-intent-search.mjs')) {
            if (!text.includes(quoteStep)) throw new Error('quote lifecycle anchor missing');
            text = text.replace(quoteStep, intentStep + quoteStep);
          }

          const readyText = 'echo "Quote, booking, signed local Stripe webhook, idempotency, payment ledger, mission completion and review verified on ephemeral Supabase."';
          const improvedReadyText = 'echo "Intent analysis, exact provider search, quote, booking, signed local Stripe webhook, idempotency, payment ledger, mission completion and review verified on ephemeral Supabase."';
          if (text.includes(readyText)) {
            text = text.replace(readyText, improvedReadyText);
          }

          fs.writeFileSync(path, text);
          NODE

          node --check scripts/golden-path-intent-search.mjs
          git diff --check

      - name: Commit golden path intent/search integration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows/klyx-golden-path.yml; then
            echo "No intent/search workflow changes to commit."
            exit 0
          fi
          git config user.name "klyx-ci"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/klyx-golden-path.yml
          git commit -m "test: run intent and provider search before quote lifecycle"
          git push origin HEAD:test/golden-path-analyze-search
