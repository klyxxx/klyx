name: Agent Next Security Bump

on:
  push:
    branches:
      - agent/dr-offsite-retry-20260930

permissions:
  contents: write

jobs:
  bump-next:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(security): bump Next.js to 16.3.6') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/dr-offsite-retry-20260930
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade patched Next.js line
        run: npm install next@16.3.6 eslint-config-next@16.3.6 --save-exact

      - name: Verify patched dependency tree
        run: |
          npm audit --audit-level=high
          npm test -- --run tests/integration/dr-offsite-backup-workflow-contract.test.ts

      - name: Commit lockfile update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency update required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(security): bump Next.js to 16.3.6"
          git push origin HEAD:agent/dr-offsite-retry-20260930
