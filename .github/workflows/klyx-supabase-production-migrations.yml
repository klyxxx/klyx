name: KLYX Supabase Production Migrations

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/klyx-supabase-production-migrations.yml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: klyx-supabase-production-migrations
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply Supabase production migrations
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Publish pending production migration status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          payload="$(jq -n \
            --arg state "pending" \
            --arg context "Supabase production migrations" \
            --arg description "Applying KLYX migrations to Supabase production" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "${payload}"

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate production deployment secrets
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: ${name}"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.111.0

      - name: Initialize ephemeral Supabase config
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      - name: Link production project
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show production migration status before deploy
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked

      - name: Preview pending production migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --linked --dry-run

      - name: Apply pending production migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --linked

      - name: Verify production migration status
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked
          supabase db push --linked --dry-run

      - name: Publish final production migration status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail

          state="failure"
          description="Supabase production migration deployment failed"

          if [ "$JOB_STATUS" = "success" ]; then
            state="success"
            description="Supabase production migrations are fully applied"
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            state="error"
            description="Supabase production migration deployment was cancelled"
          fi

          payload="$(jq -n \
            --arg state "$state" \
            --arg context "Supabase production migrations" \
            --arg description "$description" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "${payload}"
