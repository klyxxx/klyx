name: KLYX Supabase Production Migrations

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/klyx-supabase-production-migrations.yml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: klyx-supabase-production-migrations
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply Supabase production migrations
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}

    steps:
      - name: Publish pending production migration status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          payload="$(jq -n \
            --arg state "pending" \
            --arg context "Supabase production migrations" \
            --arg description "Applying KLYX migrations to Supabase production" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "${payload}"

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Select production deployment mode
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${SUPABASE_DB_URL:-}" ]; then
            effective_db_url="$(node <<'NODE'
          const raw = process.env.SUPABASE_DB_URL ?? "";
          const password = process.env.SUPABASE_DB_PASSWORD ?? "";

          let url;
          try {
            url = new URL(raw);
          } catch {
            console.error("SUPABASE_DB_URL is not a valid URL.");
            process.exit(2);
          }

          if (url.protocol !== "postgres:" && url.protocol !== "postgresql:") {
            console.error("SUPABASE_DB_URL must be a Postgres connection URL.");
            process.exit(2);
          }

          const hostname = url.hostname.toLowerCase();
          const isSupabaseHost =
            hostname.endsWith(".supabase.co") ||
            hostname.endsWith(".pooler.supabase.com");

          if (!isSupabaseHost) {
            console.error("SUPABASE_DB_URL must target a Supabase database host.");
            process.exit(3);
          }

          if (password) {
            url.password = password;
          }

          if (!url.password) {
            console.error(
              "SUPABASE_DB_URL must contain a database password or SUPABASE_DB_PASSWORD must be configured."
            );
            process.exit(4);
          }

          process.stdout.write(url.toString());
          NODE
            )"

            echo "::add-mask::$effective_db_url"
            echo "SUPABASE_EFFECTIVE_DB_URL=$effective_db_url" >> "$GITHUB_ENV"
            echo "SUPABASE_DEPLOY_MODE=db_url" >> "$GITHUB_ENV"

            if [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
              echo "Using database URL mode with the separate database password secret."
            else
              echo "Using database URL mode with credentials embedded in SUPABASE_DB_URL."
            fi
            exit 0
          fi

          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD NEXT_PUBLIC_SUPABASE_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret for linked fallback mode: ${name}"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "::error::Configure SUPABASE_DB_URL, or configure all linked-mode credentials above."
            exit 1
          fi

          echo "SUPABASE_DEPLOY_MODE=linked" >> "$GITHUB_ENV"
          echo "Using linked Supabase project deployment mode."

      - name: Derive production project ref
        if: env.SUPABASE_DEPLOY_MODE == 'linked'
        shell: bash
        run: |
          set -euo pipefail

          project_ref="$(node - <<'NODE'
          const raw = process.env.NEXT_PUBLIC_SUPABASE_URL;
          const hostname = new URL(raw).hostname;
          const ref = hostname.split(".")[0] ?? "";

          if (!/^[a-z0-9]{20}$/.test(ref)) {
            process.exit(2);
          }

          process.stdout.write(ref);
          NODE
          )"

          if [ -z "$project_ref" ]; then
            echo "::error::Unable to derive Supabase project ref from NEXT_PUBLIC_SUPABASE_URL"
            exit 1
          fi

          echo "SUPABASE_PROJECT_ID=$project_ref" >> "$GITHUB_ENV"
          echo "Supabase production project ref derived from the configured public URL."

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.111.0

      - name: Initialize ephemeral Supabase config
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      - name: Link production project
        if: env.SUPABASE_DEPLOY_MODE == 'linked'
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show production migration status before deploy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p migration-proof

          if [ "$SUPABASE_DEPLOY_MODE" = "db_url" ]; then
            supabase migration list --db-url "$SUPABASE_EFFECTIVE_DB_URL" | tee migration-proof/before.txt
          else
            supabase migration list --linked | tee migration-proof/before.txt
          fi

      - name: Preview pending production migrations
        shell: bash
        run: |
          set -euo pipefail

          # This is a one-time, production-audited reconciliation allowlist.
          # Any historical file outside this exact set keeps the deployment
          # fail-closed instead of broadening --include-all implicitly.
          approved_historical_migrations=(
            "20260905235000_klyx_activity_hidden_missions.sql"
            "20260905235500_klyx_core_payment_rpc_execution_sentinel.sql"
            "20260906000500_klyx_handle_new_user_search_path.sql"
            "20260906081500_klyx_remaining_rls_initplan_optimization.sql"
            "20260906083000_klyx_public_availability_rpc_hardening.sql"
            "20260906083500_klyx_profiles_stripe_index_history_preflight.sql"
            "20260906084000_klyx_profiles_stripe_duplicate_index_cleanup.sql"
            "20260906084500_klyx_message_notification_fk_indexes.sql"
          )

          approved_reconciliation_batch=(
            "20260905235000_klyx_activity_hidden_missions.sql"
            "20260905235500_klyx_core_payment_rpc_execution_sentinel.sql"
            "20260906000500_klyx_handle_new_user_search_path.sql"
            "20260906081500_klyx_remaining_rls_initplan_optimization.sql"
            "20260906083000_klyx_public_availability_rpc_hardening.sql"
            "20260906083500_klyx_profiles_stripe_index_history_preflight.sql"
            "20260906084000_klyx_profiles_stripe_duplicate_index_cleanup.sql"
            "20260906084500_klyx_message_notification_fk_indexes.sql"
            "20260907232000_klyx_brain_multislot_atomic_publication.sql"
            "20260909161000_klyx_sumsub_webhook_retry_lease.sql"
            "20260909181000_klyx_booking_status_history_atomicity.sql"
            "20260909214500_klyx_booking_payment_cancel_race_guard.sql"
            "20260911151000_klyx_group_refund_transaction_guard.sql"
            "20260911160000_klyx_individual_refund_route_webhook_guard.sql"
            "20260912133000_klyx_provider_legal_authority.sql"
            "20260912190000_klyx_unique_account_foundation.sql"
            "20260912233000_klyx_trust_safety_legal_foundation.sql"
            "20260912234000_klyx_trust_legal_assessments.sql"
            "20260912235000_klyx_trust_mission_enforcement.sql"
            "20260913001700_klyx_profiles_stripe_unique_index_reconciliation.sql"
          )

          historical_gap_message="Found local migration files to be inserted before the last migration on remote database."

          set +e
          if [ "$SUPABASE_DEPLOY_MODE" = "db_url" ]; then
            supabase db push --db-url "$SUPABASE_EFFECTIVE_DB_URL" --dry-run > migration-proof/dry-run-before.txt 2>&1
            preview_status=$?
          else
            supabase db push --linked --dry-run > migration-proof/dry-run-before.txt 2>&1
            preview_status=$?
          fi
          set -e

          cat migration-proof/dry-run-before.txt

          if [ "$preview_status" -eq 0 ]; then
            echo "SUPABASE_INCLUDE_ALL=false" >> "$GITHUB_ENV"
            exit 0
          fi

          if ! grep -Fq "$historical_gap_message" migration-proof/dry-run-before.txt; then
            echo "::error::Supabase dry-run failed for a reason other than the audited historical migration gap."
            exit "$preview_status"
          fi

          mapfile -t historical_migrations < <(
            grep -Eo '[0-9]{14}_[A-Za-z0-9_.-]+\.sql' migration-proof/dry-run-before.txt \
              | sort -u
          )
          mapfile -t approved_historical_sorted < <(
            printf '%s\n' "${approved_historical_migrations[@]}" | sort -u
          )

          if [ "${#historical_migrations[@]}" -ne "${#approved_historical_sorted[@]}" ]; then
            echo "::error::Refusing --include-all: historical migration count differs from the audited production gap."
            printf 'Detected historical migration: %s\n' "${historical_migrations[@]:-<none>}"
            exit 1
          fi

          for index in "${!approved_historical_sorted[@]}"; do
            if [ "${historical_migrations[$index]}" != "${approved_historical_sorted[$index]}" ]; then
              echo "::error::Refusing --include-all: historical migration set differs from the audited production gap."
              printf 'Detected historical migration: %s\n' "${historical_migrations[@]:-<none>}"
              exit 1
            fi
          done

          echo "Exact audited historical migration gap detected."
          echo "Running a second dry-run with --include-all before any production write."

          if [ "$SUPABASE_DEPLOY_MODE" = "db_url" ]; then
            supabase db push --db-url "$SUPABASE_EFFECTIVE_DB_URL" --dry-run --include-all \
              | tee migration-proof/dry-run-include-all.txt
          else
            supabase db push --linked --dry-run --include-all \
              | tee migration-proof/dry-run-include-all.txt
          fi

          mapfile -t proposed_batch < <(
            grep -Eo '[0-9]{14}_[A-Za-z0-9_.-]+\.sql' migration-proof/dry-run-include-all.txt \
              | sort -u
          )
          mapfile -t approved_batch_sorted < <(
            printf '%s\n' "${approved_reconciliation_batch[@]}" | sort -u
          )

          if [ "${#proposed_batch[@]}" -ne "${#approved_batch_sorted[@]}" ]; then
            echo "::error::Refusing production write: second dry-run batch differs from the audited reconciliation batch."
            printf 'Proposed migration: %s\n' "${proposed_batch[@]:-<none>}"
            exit 1
          fi

          for index in "${!approved_batch_sorted[@]}"; do
            if [ "${proposed_batch[$index]}" != "${approved_batch_sorted[$index]}" ]; then
              echo "::error::Refusing production write: second dry-run batch differs from the audited reconciliation batch."
              printf 'Proposed migration: %s\n' "${proposed_batch[@]:-<none>}"
              exit 1
            fi
          done

          echo "SUPABASE_INCLUDE_ALL=true" >> "$GITHUB_ENV"

      - name: Apply pending production migrations
        shell: bash
        run: |
          set -euo pipefail

          push_args=()
          if [ "${SUPABASE_INCLUDE_ALL:-false}" = "true" ]; then
            push_args+=(--include-all)
          fi

          if [ "$SUPABASE_DEPLOY_MODE" = "db_url" ]; then
            supabase db push --db-url "$SUPABASE_EFFECTIVE_DB_URL" "${push_args[@]}"
          else
            supabase db push --linked "${push_args[@]}"
          fi

      - name: Verify production migration status
        shell: bash
        run: |
          set -euo pipefail

          if [ "$SUPABASE_DEPLOY_MODE" = "db_url" ]; then
            supabase migration list --db-url "$SUPABASE_EFFECTIVE_DB_URL" | tee migration-proof/after.txt
            supabase db push --db-url "$SUPABASE_EFFECTIVE_DB_URL" --dry-run | tee migration-proof/dry-run-after.txt
          else
            supabase migration list --linked | tee migration-proof/after.txt
            supabase db push --linked --dry-run | tee migration-proof/dry-run-after.txt
          fi

          if grep -Fqi "Would push these migrations" migration-proof/dry-run-after.txt; then
            echo "::error::Supabase still reports pending production migrations after db push."
            exit 1
          fi

          printf '%s\n' \
            "commit=${GITHUB_SHA}" \
            "run=${GITHUB_RUN_ID}" \
            "mode=${SUPABASE_DEPLOY_MODE}" \
            "verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > migration-proof/proof.txt

      - name: Upload production migration proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: klyx-supabase-production-proof-${{ github.run_id }}
          path: migration-proof/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish final production migration status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail

          state="failure"
          description="Supabase production migration deployment failed"

          if [ "$JOB_STATUS" = "success" ]; then
            state="success"
            description="Supabase production migrations are fully applied"
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            state="error"
            description="Supabase production migration deployment was cancelled"
          fi

          payload="$(jq -n \
            --arg state "$state" \
            --arg context "Supabase production migrations" \
            --arg description "$description" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "${payload}"
