name: KLYX Account Stripe Verification Dispatch

on:
  push:
    branches:
      - feature/account-level-stripe-connect-20260914
    paths:
      - ".github/workflows/klyx-account-stripe-verification-dispatch.yml"

permissions:
  contents: read
  actions: write

# Final certification dispatch for the account-level Stripe Connect migration.
jobs:
  dispatch-required-gates:
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch exact KLYX verification workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KLYX_REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run klyx-security.yml --repo "$GH_REPO" --ref "$KLYX_REF"
          gh workflow run klyx-golden-path.yml --repo "$GH_REPO" --ref "$KLYX_REF" -f confirm_isolated_e2e=true
          gh workflow run klyx-performance.yml --repo "$GH_REPO" --ref "$KLYX_REF" -f profile=smoke -f confirm_isolated_target=true
          gh workflow run klyx-e2e.yml --repo "$GH_REPO" --ref "$KLYX_REF"
