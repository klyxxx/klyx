name: Temporary dependency lock generator

on:
  push:
    branches:
      - security/dependency-audit-baseline-20260909
    paths:
      - .github/workflows/dependency-lock-generator.yml

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve only required security fixes
        shell: bash
        run: |
          set -euo pipefail
          cp package.json /tmp/package.json.original
          npm install --package-lock-only --ignore-scripts \
            next@16.3.3 \
            sharp@0.35.4 \
            js-yaml@4.3.2 \
            hono@4.13.5
          cp /tmp/package.json.original package.json
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code -- package.json

          node <<'NODE'
          const lock = require('./package-lock.json')
          const expected = {
            'node_modules/next': '16.3.3',
            'node_modules/sharp': '0.35.4',
            'node_modules/js-yaml': '4.3.2',
            'node_modules/hono': '4.13.5',
          }
          for (const [path, version] of Object.entries(expected)) {
            const actual = lock.packages?.[path]?.version
            if (actual !== version) {
              throw new Error(`${path}: expected ${version}, got ${actual}`)
            }
          }
          NODE

          test "$(git status --porcelain | awk '{print $2}' | sort -u | tr '\n' ' ')" = "package-lock.json "
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=moderate

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): refresh audited lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
