name: KLYX Account Stripe Test Diagnostic

on:
  push:
    branches:
      - feature/account-level-stripe-connect-20260914
    paths:
      - ".github/workflows/klyx-account-stripe-test-diagnostic.yml"

permissions:
  contents: read

jobs:
  verbose-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run verbose tests
        id: tests
        shell: bash
        run: |
          set +e
          npm test -- --reporter=verbose 2>&1 | tee /tmp/klyx-test-output.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload verbose test output
        uses: actions/upload-artifact@v4
        with:
          name: klyx-account-stripe-test-output
          path: /tmp/klyx-test-output.txt
          if-no-files-found: error
          retention-days: 1

      - name: Preserve test result
        shell: bash
        run: |
          test "${{ steps.tests.outputs.exit_code }}" = "0"
