name: KLYX Unified Assistant Main Sync

on:
  push:
    branches:
      - feat/unified-assistant-obtain-earn-20260912
    paths:
      - .github/workflows/klyx-unified-assistant-main-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unified-assistant-obtain-earn-20260912
          fetch-depth: 0

      - name: Merge latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "klyxxx"
          git config user.email "yeswork2711@gmail.com"
          git fetch origin main
          git merge --no-edit origin/main
          git merge-base --is-ancestor origin/main HEAD

      - name: Verify current contracts and self-delete
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n 'KLYX_PROVIDER_ASSISTANT_AI_UI_12_81' tests; then
            echo "Obsolete provider-assistant UI contract is still present."
            exit 1
          fi
          test -f app/provider/assistant/page.tsx
          grep -q 'redirect("/assistant")' app/provider/assistant/page.tsx
          grep -q 'requireAccountType(profile, "provider")' app/api/provider/assistant/assistant-route-core.ts
          git diff --check
          rm .github/workflows/klyx-unified-assistant-main-sync.yml
          git status --short

      - name: Commit cleanup and push
        shell: bash
        run: |
          set -euo pipefail
          git add -A .github/workflows/klyx-unified-assistant-main-sync.yml
          if ! git diff --cached --quiet; then
            git commit -m "ci: remove unified assistant sync helper"
          fi
          git push origin HEAD:feat/unified-assistant-obtain-earn-20260912
