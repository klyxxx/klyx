name: KLYX Unified Assistant Main Sync

on:
  push:
    branches:
      - feat/unified-assistant-obtain-earn-20260912
    paths:
      - .github/workflows/klyx-unified-assistant-main-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unified-assistant-obtain-earn-20260912
          fetch-depth: 0

      - name: Merge latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "klyxxx"
          git config user.email "yeswork2711@gmail.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Align obsolete provider assistant UI contract
        shell: bash
        run: |
          set -euo pipefail
          test_file="tests/integration/klyx-ai-first-client-provider-contract.test.ts"
          if [[ ! -f "$test_file" ]]; then
            echo "Expected contract not found. Matching files:"
            find tests -type f -iname '*ai-first*provider*' -print || true
            grep -R -n 'KLYX_PROVIDER_ASSISTANT_AI_UI_12_81' tests || true
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path

          path = Path("tests/integration/klyx-ai-first-client-provider-contract.test.ts")
          text = path.read_text()

          old = '''    expect(providerAssistant).toContain("KLYX_PROVIDER_ASSISTANT_AI_UI_12_81");
              expect(providerAssistant).toContain('fetch("/api/provider/assistant"');'''
          if old not in text:
              # Handle ordinary two-line indentation without relying on formatter spacing.
              lines = text.splitlines()
              marker = 'expect(providerAssistant).toContain("KLYX_PROVIDER_ASSISTANT_AI_UI_12_81");'
              fetch = 'expect(providerAssistant).toContain(\'fetch("/api/provider/assistant"\');'
              marker_indexes = [i for i, line in enumerate(lines) if marker in line]
              fetch_indexes = [i for i, line in enumerate(lines) if fetch in line]
              if len(marker_indexes) != 1 or len(fetch_indexes) != 1:
                  raise SystemExit(
                      f"obsolete UI assertions not uniquely found: marker={marker_indexes}, fetch={fetch_indexes}"
                  )
              mi, fi = marker_indexes[0], fetch_indexes[0]
              indent = lines[mi][: len(lines[mi]) - len(lines[mi].lstrip())]
              lines[mi] = indent + 'expect(providerAssistant).toContain(\'redirect("/assistant")\');'
              lines[fi] = indent + 'expect(providerAssistant).not.toContain(\'fetch("/api/provider/assistant"\');'
              text = "\n".join(lines) + ("\n" if path.read_text().endswith("\n") else "")
          else:
              text = text.replace(
                  old,
                  '''    expect(providerAssistant).toContain('redirect("/assistant")');
              expect(providerAssistant).not.toContain('fetch("/api/provider/assistant"');''',
                  1,
              )

          # Preserve the API-side provider safety boundary.
          required = [
              'requireAccountType(profile, "provider")',
              'automaticExecutionAllowed',
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f"provider API safety assertion missing after patch: {token}")

          path.write_text(text)
          PY

      - name: Verify and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -n 'redirect("/assistant")' tests/integration/klyx-ai-first-client-provider-contract.test.ts
          grep -n 'requireAccountType(profile, "provider")' tests/integration/klyx-ai-first-client-provider-contract.test.ts
          rm .github/workflows/klyx-unified-assistant-main-sync.yml
          git status --short

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git add tests/integration/klyx-ai-first-client-provider-contract.test.ts .github/workflows/klyx-unified-assistant-main-sync.yml
          if ! git diff --cached --quiet; then
            git commit -m "test: align provider assistant contract with unified shell"
          fi
          git push origin HEAD:feat/unified-assistant-obtain-earn-20260912
