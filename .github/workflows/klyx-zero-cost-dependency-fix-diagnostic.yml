name: KLYX Zero Cost Dependency Fix Diagnostic

on:
  push:
    branches:
      - feature/zero-cost-control-plane
    paths:
      - ".github/workflows/klyx-zero-cost-dependency-fix-diagnostic.yml"

permissions:
  contents: write

jobs:
  finalize-safe-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feature/zero-cost-control-plane

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm resolver
        run: |
          npm install --global npm@11
          npm --version

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Update only vulnerable dependency families in lockfile
        run: npm update --package-lock-only vitest brace-expansion fast-uri

      - name: Verify no high dependency vulnerability remains
        run: npm audit --audit-level=high

      - name: Commit safe lockfile and remove temporary diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/klyx-zero-cost-dependency-fix-diagnostic.yml
          git commit -m "chore: refresh secure dependency lock"
          git push origin HEAD:feature/zero-cost-control-plane
