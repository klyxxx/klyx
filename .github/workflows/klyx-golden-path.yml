name: KLYX Golden Path

on:
  workflow_dispatch:
    inputs:
      confirm_isolated_e2e:
        description: "Confirm dedicated E2E Supabase + Stripe test mode"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

# Mutation-heavy launch proof must never race with itself.
concurrency:
  group: klyx-golden-path-${{ github.repository }}
  cancel-in-progress: false

jobs:
  golden-path:
    name: Golden path isolated verification
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    env:
      KLYX_GOLDEN_PATH_MUTATIONS_ENABLED: ${{ inputs.confirm_isolated_e2e }}
      KLYX_PRODUCTION_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}

      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.KLYX_E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.KLYX_E2E_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.KLYX_E2E_SUPABASE_SERVICE_ROLE_KEY }}
      KLYX_E2E_SUPABASE_DB_URL: ${{ secrets.KLYX_E2E_SUPABASE_DB_URL }}
      KLYX_E2E_SUPABASE_DB_PASSWORD: ${{ secrets.KLYX_E2E_SUPABASE_DB_PASSWORD }}
      KLYX_E2E_EMAIL: ${{ secrets.KLYX_GOLDEN_PATH_EMAIL }}
      KLYX_E2E_PASSWORD: ${{ secrets.KLYX_GOLDEN_PATH_PASSWORD }}

      KLYX_STRIPE_MODE: "test"
      STRIPE_SECRET_KEY: ${{ secrets.KLYX_E2E_STRIPE_SECRET_KEY }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.KLYX_E2E_STRIPE_PUBLISHABLE_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.KLYX_E2E_STRIPE_WEBHOOK_SECRET }}
      KLYX_ALLOW_PLATFORM_ONLY_TEST_PAYMENTS: "true"
      KLYX_LIVE_PAYMENTS_ENABLED: "false"
      NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3100"
      KLYX_PLAYWRIGHT_SYSTEM_CHROME: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refuse unsafe golden path environment
        shell: bash
        run: |
          set -euo pipefail

          if [ "$KLYX_GOLDEN_PATH_MUTATIONS_ENABLED" != "true" ]; then
            echo "::error::Golden path mutations require explicit isolated-E2E confirmation."
            exit 1
          fi

          required=(
            KLYX_PRODUCTION_SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
            SUPABASE_SERVICE_ROLE_KEY
            KLYX_E2E_SUPABASE_DB_URL
            KLYX_E2E_SUPABASE_DB_PASSWORD
            KLYX_E2E_EMAIL
            KLYX_E2E_PASSWORD
            STRIPE_SECRET_KEY
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
            STRIPE_WEBHOOK_SECRET
          )

          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is missing."
              exit 1
            fi
          done

          if [ "$NEXT_PUBLIC_SUPABASE_URL" = "$KLYX_PRODUCTION_SUPABASE_URL" ]; then
            echo "::error::Golden path Supabase must be a dedicated non-production project."
            exit 1
          fi

          node <<'NODE'
          const e2e = new URL(process.env.NEXT_PUBLIC_SUPABASE_URL);
          const production = new URL(process.env.KLYX_PRODUCTION_SUPABASE_URL);

          const isSupabaseHost = (hostname) =>
            hostname.endsWith(".supabase.co") || hostname.endsWith(".supabase.com");

          if (!isSupabaseHost(e2e.hostname) || !isSupabaseHost(production.hostname)) {
            throw new Error("Supabase URLs must target Supabase-hosted projects.");
          }

          if (e2e.hostname === production.hostname) {
            throw new Error("Golden path E2E and production Supabase hosts must differ.");
          }
          NODE

          case "$STRIPE_SECRET_KEY" in
            sk_test_*) ;;
            *) echo "::error::Golden path requires a Stripe sk_test_ secret key."; exit 1 ;;
          esac

          case "$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" in
            pk_test_*) ;;
            *) echo "::error::Golden path requires a Stripe pk_test_ publishable key."; exit 1 ;;
          esac

          case "$STRIPE_WEBHOOK_SECRET" in
            whsec_*) ;;
            *) echo "::error::Golden path requires a Stripe whsec_ webhook secret."; exit 1 ;;
          esac

          if [ "$KLYX_STRIPE_MODE" != "test" ] || [ "$KLYX_LIVE_PAYMENTS_ENABLED" != "false" ]; then
            echo "::error::Golden path must run with live payments disabled."
            exit 1
          fi

      - name: Resolve isolated E2E database target
        shell: bash
        run: |
          set -euo pipefail
          effective_db_url="$(node scripts/golden-path-database-url.mjs)"
          echo "::add-mask::$effective_db_url"
          echo "KLYX_E2E_EFFECTIVE_DB_URL=$effective_db_url" >> "$GITHUB_ENV"
          echo "Validated isolated Supabase E2E database target."

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.111.0

      - name: Initialize ephemeral Supabase config
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      - name: Show E2E migration status before sync
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p golden-path-migration-proof
          supabase migration list --db-url "$KLYX_E2E_EFFECTIVE_DB_URL" \
            | tee golden-path-migration-proof/before.txt

      - name: Preview pending E2E migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "$KLYX_E2E_EFFECTIVE_DB_URL" --dry-run \
            | tee golden-path-migration-proof/dry-run-before.txt

      - name: Apply pending E2E migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "$KLYX_E2E_EFFECTIVE_DB_URL"

      - name: Verify E2E migration sync
        shell: bash
        run: |
          set -euo pipefail

          supabase migration list --db-url "$KLYX_E2E_EFFECTIVE_DB_URL" \
            | tee golden-path-migration-proof/after.txt
          supabase db push --db-url "$KLYX_E2E_EFFECTIVE_DB_URL" --dry-run \
            | tee golden-path-migration-proof/dry-run-after.txt

          if grep -Fqi "Would push these migrations" golden-path-migration-proof/dry-run-after.txt; then
            echo "::error::Supabase still reports pending E2E migrations after db push."
            exit 1
          fi

          printf '%s\n' \
            "commit=${GITHUB_SHA}" \
            "run=${GITHUB_RUN_ID}" \
            "verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > golden-path-migration-proof/proof.txt

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap dedicated golden path account
        run: node scripts/golden-path-bootstrap.mjs

      - name: Verify dedicated golden path account
        run: node scripts/golden-path-preflight.mjs

      - name: Verify test suite
        run: npm test

      - name: TypeScript
        run: npx tsc --noEmit --pretty false

      - name: Production build
        run: npm run build

      # The mutation golden-path spec is added only after the dedicated
      # Supabase/Stripe test secrets above are configured. Until then,
      # this workflow stops after schema, runtime and account proof.
      - name: Golden path harness ready
        run: echo "Isolated Supabase schema, Stripe test runtime and dedicated account verified."

      - name: Upload E2E migration proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: klyx-golden-path-migration-proof-${{ github.run_id }}
          path: golden-path-migration-proof/
          if-no-files-found: ignore
          retention-days: 14
