name: KLYX Golden Path

on:
  workflow_dispatch:
    inputs:
      confirm_isolated_e2e:
        description: "Confirm ephemeral local Supabase + Stripe test mode"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/klyx-golden-path.yml"
      - "scripts/golden-path-*.mjs"
      - "supabase/migrations/**"
      - "app/api/requests/analyze/**"
      - "app/api/search/providers/**"
      - "app/api/bookings/**"
      - "app/api/quotes/**"
      - "app/api/reviews/**"
      - "app/api/stripe/webhook/**"
      - "app/api/provider/finance/**"
      - "lib/universal-service-request.ts"
      - "lib/location-intent.ts"
      - "lib/catalog-service-matcher.ts"
      - "lib/provider-search.ts"
      - "lib/provider-skill-publication.ts"
      - "lib/booking-tracking-time.ts"
      - "lib/stripe-payments.ts"
      - "lib/stripe-webhook-events.ts"
      - "lib/payment-ledger.ts"
      - "lib/api-auth.ts"

  push:
    branches:
      - main
    paths:
      - ".github/workflows/klyx-golden-path.yml"
      - "scripts/golden-path-*.mjs"
      - "supabase/migrations/**"
      - "app/api/requests/analyze/**"
      - "app/api/search/providers/**"
      - "app/api/bookings/**"
      - "app/api/quotes/**"
      - "app/api/reviews/**"
      - "app/api/stripe/webhook/**"
      - "app/api/provider/finance/**"
      - "lib/universal-service-request.ts"
      - "lib/location-intent.ts"
      - "lib/catalog-service-matcher.ts"
      - "lib/provider-search.ts"
      - "lib/provider-skill-publication.ts"
      - "lib/booking-tracking-time.ts"
      - "lib/stripe-payments.ts"
      - "lib/stripe-webhook-events.ts"
      - "lib/payment-ledger.ts"
      - "lib/api-auth.ts"

permissions:
  contents: read

# Mutation-heavy launch proof must never race with itself.
concurrency:
  group: klyx-golden-path-${{ github.repository }}
  cancel-in-progress: false

jobs:
  golden-path:
    name: Golden path isolated verification
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    env:
      KLYX_GOLDEN_PATH_MUTATIONS_ENABLED: ${{ github.event_name != 'workflow_dispatch' && 'true' || inputs.confirm_isolated_e2e }}
      KLYX_GOLDEN_PATH_LOCAL_SUPABASE: "true"
      KLYX_PRODUCTION_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_TELEMETRY_DISABLED: "1"

      KLYX_STRIPE_MODE: "test"
      STRIPE_SECRET_KEY: "sk_test_klyx_golden_path_local_only"
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_klyx_golden_path_local_only"
      KLYX_ALLOW_PLATFORM_ONLY_TEST_PAYMENTS: "true"
      KLYX_LIVE_PAYMENTS_ENABLED: "false"
      NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3100"
      KLYX_PLAYWRIGHT_SYSTEM_CHROME: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refuse unsafe golden path trigger
        shell: bash
        run: |
          set -euo pipefail

          if [ "$KLYX_GOLDEN_PATH_MUTATIONS_ENABLED" != "true" ]; then
            echo "::error::Golden path mutations require explicit isolated-E2E confirmation."
            exit 1
          fi

          if [ -z "${KLYX_PRODUCTION_SUPABASE_URL:-}" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL production comparison secret is missing."
            exit 1
          fi

          node <<'NODE'
          const production = new URL(process.env.KLYX_PRODUCTION_SUPABASE_URL);
          const hostname = production.hostname.toLowerCase();
          const valid =
            hostname.endsWith(".supabase.co") ||
            hostname.endsWith(".supabase.com");

          if (!valid) {
            throw new Error("Production comparison URL must target Supabase.");
          }

          if (["127.0.0.1", "localhost", "[::1]"].includes(hostname)) {
            throw new Error("Production comparison URL must not be loopback.");
          }
          NODE

          case "${STRIPE_SECRET_KEY:-}" in
            sk_test_*) ;;
            *) echo "::error::Golden path requires a test-only Stripe-shaped runtime key."; exit 1 ;;
          esac

          if [ "$KLYX_STRIPE_MODE" != "test" ] || [ "$KLYX_LIVE_PAYMENTS_ENABLED" != "false" ]; then
            echo "::error::Golden path must run with live payments disabled."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.111.0

      - name: Initialize local Supabase config
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      - name: Start ephemeral local Supabase
        shell: bash
        run: |
          set -euo pipefail
          supabase start \
            -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Export ephemeral Supabase and test credentials
        shell: bash
        run: |
          set -euo pipefail

          eval "$(supabase status -o env)"

          local_public_key="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"

          for name in API_URL SERVICE_ROLE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Supabase local status did not provide ${name}."
              exit 1
            fi
          done

          if [ -z "$local_public_key" ]; then
            echo "::error::Supabase local status did not provide ANON_KEY/PUBLISHABLE_KEY."
            exit 1
          fi

          case "$API_URL" in
            http://127.0.0.1:54321|http://localhost:54321) ;;
            *) echo "::error::Refusing non-loopback Supabase API URL: ${API_URL}"; exit 1 ;;
          esac

          golden_email="golden-path-${GITHUB_RUN_ID}@example.test"
          golden_password="$(openssl rand -base64 36 | tr -d '\n')"
          webhook_secret="whsec_$(openssl rand -hex 32)"

          echo "::add-mask::$local_public_key"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "::add-mask::$golden_password"
          echo "::add-mask::$webhook_secret"

          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$local_public_key"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "KLYX_E2E_EMAIL=$golden_email"
            echo "KLYX_E2E_PASSWORD=$golden_password"
            echo "STRIPE_WEBHOOK_SECRET=$webhook_secret"
          } >> "$GITHUB_ENV"

          echo "Ephemeral local Supabase credentials prepared for this run only."

      - name: Verify isolated runtime guards
        run: >-
          node --input-type=module -e
          "import('./scripts/golden-path-runtime.mjs').then(({assertGoldenPathIsolation}) => assertGoldenPathIsolation())"

      - name: Capture local migration proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p golden-path-migration-proof

          supabase migration list --local \
            | tee golden-path-migration-proof/migrations.txt

          latest_file="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort | tail -n 1)"
          latest_version="${latest_file%%_*}"

          if [ -z "$latest_version" ]; then
            echo "::error::No KLYX migration was found."
            exit 1
          fi

          if ! grep -Fq "$latest_version" golden-path-migration-proof/migrations.txt; then
            echo "::error::Latest KLYX migration ${latest_version} is not applied in local Supabase."
            exit 1
          fi

          printf '%s\n' \
            "commit=${GITHUB_SHA}" \
            "run=${GITHUB_RUN_ID}" \
            "latest_migration=${latest_version}" \
            "verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > golden-path-migration-proof/proof.txt

      - name: Bootstrap dedicated golden path account
        run: node scripts/golden-path-bootstrap.mjs

      - name: Verify dedicated golden path account
        run: node scripts/golden-path-preflight.mjs

      - name: Prepare bookable provider fixture
        run: node scripts/golden-path-provider-fixture.mjs

      - name: Verify test suite
        run: npm test

      - name: TypeScript
        run: npx tsc --noEmit --pretty false

      - name: Production build
        run: npm run build

      - name: Start golden path production server
        shell: bash
        run: |
          set -euo pipefail

          npm run start -- -p 3100 > golden-path-server.log 2>&1 &
          server_pid=$!
          echo "KLYX_GOLDEN_PATH_SERVER_PID=$server_pid" >> "$GITHUB_ENV"

          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:3100/login \
              > /dev/null; then
              echo "Golden path production server is ready."
              exit 0
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "::error::Golden path production server exited early."
              cat golden-path-server.log
              exit 1
            fi

            sleep 1
          done

          echo "::error::Golden path production server did not become ready."
          cat golden-path-server.log
          exit 1

      - name: Verify client intent and exact provider search
        run: node scripts/golden-path-intent-search.mjs

      - name: Verify client quote and booking lifecycle
        run: node scripts/golden-path-client-lifecycle.mjs

      - name: Verify signed webhook, mission and review lifecycle
        run: node scripts/golden-path-service-lifecycle.mjs

      - name: Verify provider finance visibility and reconciliation
        run: node scripts/golden-path-provider-finance.mjs

      - name: Golden path local lifecycle ready
        run: >-
          echo "Intent analysis, exact provider search, quote, booking, signed local Stripe webhook, idempotency, payment ledger, mission completion, review and provider finance reconciliation verified on ephemeral Supabase."

      - name: Stop golden path production server
        if: always()
        shell: bash
        run: |
          if [ -n "${KLYX_GOLDEN_PATH_SERVER_PID:-}" ] && \
             kill -0 "$KLYX_GOLDEN_PATH_SERVER_PID" 2>/dev/null; then
            kill "$KLYX_GOLDEN_PATH_SERVER_PID" || true
          fi

      - name: Upload local migration proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: klyx-golden-path-local-proof-${{ github.run_id }}
          path: golden-path-migration-proof/
          if-no-files-found: ignore
          retention-days: 14

      - name: Destroy ephemeral local Supabase
        if: always()
        shell: bash
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup || true
          fi
