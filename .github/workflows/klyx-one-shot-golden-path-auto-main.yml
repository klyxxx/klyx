name: KLYX one-shot golden path auto-main patch

on:
  push:
    branches:
      - test/golden-path-full-local-proof-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/golden-path-full-local-proof-v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable filtered main golden path execution
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const workflowPath = '.github/workflows/klyx-golden-path.yml';
          let workflow = fs.readFileSync(workflowPath, 'utf8');

          const oldTrigger = `on:\n  workflow_dispatch:\n    inputs:\n      confirm_isolated_e2e:\n        description: "Confirm ephemeral local Supabase + Stripe test mode"\n        required: true\n        default: "false"\n        type: choice\n        options:\n          - "false"\n          - "true"\n`;

          const newTrigger = `on:\n  workflow_dispatch:\n    inputs:\n      confirm_isolated_e2e:\n        description: "Confirm ephemeral local Supabase + Stripe test mode"\n        required: true\n        default: "false"\n        type: choice\n        options:\n          - "false"\n          - "true"\n\n  push:\n    branches:\n      - main\n    paths:\n      - ".github/workflows/klyx-golden-path.yml"\n      - "scripts/golden-path-*.mjs"\n      - "supabase/migrations/**"\n      - "app/api/bookings/**"\n      - "app/api/quotes/**"\n      - "app/api/reviews/**"\n      - "app/api/stripe/webhook/**"\n      - "lib/booking-tracking-time.ts"\n      - "lib/stripe-payments.ts"\n      - "lib/stripe-webhook-events.ts"\n      - "lib/payment-ledger.ts"\n      - "lib/api-auth.ts"\n`;

          if (!workflow.includes(oldTrigger)) {
            throw new Error('Golden-path workflow trigger anchor not found');
          }
          workflow = workflow.replace(oldTrigger, newTrigger);

          const oldMutationEnv = '      KLYX_GOLDEN_PATH_MUTATIONS_ENABLED: ${{ inputs.confirm_isolated_e2e }}';
          const newMutationEnv = "      KLYX_GOLDEN_PATH_MUTATIONS_ENABLED: ${{ github.event_name == 'push' && 'true' || inputs.confirm_isolated_e2e }}";

          if (!workflow.includes(oldMutationEnv)) {
            throw new Error('Golden-path mutation env anchor not found');
          }
          workflow = workflow.replace(oldMutationEnv, newMutationEnv);
          fs.writeFileSync(workflowPath, workflow);

          const contractPath = 'tests/integration/golden-path-workflow-safety-contract.test.ts';
          let contract = fs.readFileSync(contractPath, 'utf8');

          const oldTest = `  it("is manual-only and requires explicit mutation confirmation", () => {\n    expect(workflow).toContain("workflow_dispatch:");\n    expect(workflow).not.toContain("pull_request:");\n    expect(workflow).not.toContain("push:");\n    expect(workflow).toContain(\n      "KLYX_GOLDEN_PATH_MUTATIONS_ENABLED: ${{ inputs.confirm_isolated_e2e }}"\n    );\n    expect(workflow).toContain(\n      'if [ "$KLYX_GOLDEN_PATH_MUTATIONS_ENABLED" != "true" ]'\n    );\n  });`;

          const newTest = `  it("runs manually or after filtered main changes and still requires mutation confirmation", () => {\n    expect(workflow).toContain("workflow_dispatch:");\n    expect(workflow).toContain("push:");\n    expect(workflow).toContain("      - main");\n    expect(workflow).toContain('      - "supabase/migrations/**"');\n    expect(workflow).toContain('      - "app/api/bookings/**"');\n    expect(workflow).toContain('      - "app/api/stripe/webhook/**"');\n    expect(workflow).toContain('      - "lib/booking-tracking-time.ts"');\n    expect(workflow).not.toContain("pull_request:");\n    expect(workflow).toContain(\n      "KLYX_GOLDEN_PATH_MUTATIONS_ENABLED: ${{ github.event_name == 'push' && 'true' || inputs.confirm_isolated_e2e }}"\n    );\n    expect(workflow).toContain(\n      'if [ "$KLYX_GOLDEN_PATH_MUTATIONS_ENABLED" != "true" ]'\n    );\n  });`;

          if (!contract.includes(oldTest)) {
            throw new Error('Golden-path safety contract trigger test anchor not found');
          }
          contract = contract.replace(oldTest, newTest);
          fs.writeFileSync(contractPath, contract);
          NODE

          node --check scripts/golden-path-service-lifecycle.mjs
          git diff --check

      - name: Commit automatic-main golden path policy
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            .github/workflows/klyx-golden-path.yml \
            tests/integration/golden-path-workflow-safety-contract.test.ts; then
            echo "No golden-path auto-main changes to commit."
            exit 0
          fi

          git config user.name "klyx-ci"
          git config user.email "actions@users.noreply.github.com"
          git add \
            .github/workflows/klyx-golden-path.yml \
            tests/integration/golden-path-workflow-safety-contract.test.ts
          git commit -m "ci: run local golden path after critical main changes"
          git push origin HEAD:test/golden-path-full-local-proof-v2
