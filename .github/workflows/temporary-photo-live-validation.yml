name: Temporary photo live final validation

on:
  push:
    branches:
      - validation/photo-live-final-20260909

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d135ac0e12d841ae75881bf67f710e531ace01bf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Photo camera unit
        run: npx vitest run tests/unit/photo-camera.test.ts --reporter=verbose
      - name: Photo UI contract
        if: always()
        run: npx vitest run tests/unit/photo-request-ui-contract.test.ts --reporter=verbose
      - name: Photo visual contract
        if: always()
        run: npx vitest run tests/integration/photo-request-visual-contract.test.ts --reporter=verbose
      - name: Photo server boundary contract
        if: always()
        run: npx vitest run tests/integration/photo-service-requests-server-only-contract.test.ts --reporter=verbose
      - name: Photo vision contract
        if: always()
        run: npx vitest run tests/integration/photo-vision-analysis-contract.test.ts --reporter=verbose
      - name: Private request privilege contract
        if: always()
        run: npx vitest run tests/integration/private-request-table-privilege-hardening-contract.test.ts --reporter=verbose
