name: KLYX One-shot Stripe Auth First

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".github/workflows/klyx-one-shot-stripe-auth-first.yml"

permissions:
  contents: write

jobs:
  transform:
    name: Apply exact Stripe auth-first transform
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref }}

      - name: Apply verified replacements
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def swap_adjacent_once(path: str, first: str, second: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              pair = first + second
              if text.count(first) != 1:
                  raise SystemExit(f"{path}: first block count is {text.count(first)}, expected 1")
              if text.count(second) != 1:
                  raise SystemExit(f"{path}: second block count is {text.count(second)}, expected 1")
              if text.count(pair) != 1:
                  raise SystemExit(f"{path}: expected auth and runtime blocks to be adjacent in the unsafe order")
              p.write_text(text.replace(pair, second + first, 1), encoding="utf-8")

          checkout_stripe = (
              "    assertStripeRuntimeReady();\n"
              "\n"
              "    const stripeSecretKey = requiredEnv(\"STRIPE_SECRET_KEY\");\n"
              "    const stripe = new Stripe(stripeSecretKey);\n"
              "\n"
          )
          checkout_auth = (
              "    const { user, profile } = await getAuthenticatedProfile(request);\n"
              "    requireAccountType(profile, \"client\");\n"
              "\n"
          )
          swap_adjacent_once(
              "app/api/stripe/create-checkout-session/route.ts",
              checkout_stripe,
              checkout_auth,
          )

          group_stripe = (
              "    assertStripeRuntimeReady();\n"
              "\n"
              "    const stripeKey =\n"
              "      requiredEnv(\n"
              "        \"STRIPE_SECRET_KEY\"\n"
              "      );\n"
              "\n"
              "    const stripe =\n"
              "      new Stripe(\n"
              "        stripeKey\n"
              "      );\n"
              "\n"
          )
          group_auth = (
              "    const {\n"
              "      user,\n"
              "      profile,\n"
              "    } =\n"
              "      await getAuthenticatedProfile(\n"
              "        request\n"
              "      );\n"
              "\n"
              "    requireAccountType(\n"
              "      profile,\n"
              "      \"client\"\n"
              "    );\n"
              "\n"
          )
          swap_adjacent_once(
              "app/api/stripe/create-group-checkout-session/route.ts",
              group_stripe,
              group_auth,
          )

          test_path = Path("tests/e2e/anonymous-api-security.spec.ts")
          tests = test_path.read_text(encoding="utf-8")
          marker = "Stripe checkout creation authenticates before runtime configuration"
          if marker in tests:
              raise SystemExit("anonymous Stripe checkout tests already exist")
          closing = "\n});\n"
          if not tests.endswith(closing):
              raise SystemExit("anonymous API security spec has an unexpected ending")
          additions = (
              "\n\n"
              "  test(\"Stripe checkout creation authenticates before runtime configuration\", async ({ request }) => {\n"
              "    const response = await request.post(\"/api/stripe/create-checkout-session\", {\n"
              "      data: {},\n"
              "    });\n"
              "    expect(response.status()).toBe(401);\n"
              "  });\n"
              "\n"
              "  test(\"Stripe group checkout creation authenticates before runtime configuration\", async ({ request }) => {\n"
              "    const response = await request.post(\"/api/stripe/create-group-checkout-session\", {\n"
              "      data: {},\n"
              "    });\n"
              "    expect(response.status()).toBe(401);\n"
              "  });"
          )
          test_path.write_text(tests[:-len(closing)] + additions + closing, encoding="utf-8")
          PY

      - name: Commit transformed files
        shell: bash
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/api/stripe/create-checkout-session/route.ts \
            app/api/stripe/create-group-checkout-session/route.ts \
            tests/e2e/anonymous-api-security.spec.ts
          if git diff --cached --quiet; then
            echo "::error::The verified transform produced no changes."
            exit 1
          fi
          git commit -m "security: authenticate checkout APIs before Stripe runtime"
          git push origin "HEAD:${PR_BRANCH}"
